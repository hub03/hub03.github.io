<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devis box</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f9f9f9;
  padding: 20px;
}

.wrap {
  max-width: 420px;
  margin: auto;
}

h1 {
  text-align: center;
}

select, input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  font-size: 16px;
}

button {
  background: #111;
  color: #fff;
  border: none;
  border-radius: 6px;
}

button:disabled {
  opacity: .5;
}

.price {
  font-weight: bold;
  text-align: center;
  margin-top: 10px;
}

.desc {
  background: #fff;
  padding: 10px;
  border-radius: 6px;
  font-size: 14px;
  margin-top: 5px;
}

.toast {
  font-size: 13px;
  margin-top: 10px;
}
</style>
</head>

<body>
<div class="wrap">

<h1>Devis box</h1>

<select id="offer">
  <option value="" disabled selected>Choisir une offre</option>

  <option value="https://hub03.github.io/starter.html"
    data-price="27,99 €/mois"
    data-desc="Box 7 – 1Gb/s – WiFi 5">
    Starter
  </option>

  <option value="https://hub03.github.io/power.html"
    data-price="36,99 €/mois"
    data-desc="Box 8 – 2Gb/s – WiFi 6">
    Power
  </option>

  <option value="https://hub03.github.io/premium.html"
    data-price="44,99 €/mois"
    data-desc="Box 8 – 8Gb/s – WiFi 6">
    Premium
  </option>
</select>

<div id="price" class="price"></div>
<div id="desc" class="desc"></div>

<input id="phone" type="tel" placeholder="Numéro de mobile">

<button id="send" disabled>Envoyer</button>

<div id="toast" class="toast"></div>

</div>

<script>
const offer = document.getElementById('offer');
const phone = document.getElementById('phone');
const send  = document.getElementById('send');
const price = document.getElementById('price');
const desc  = document.getElementById('desc');
const toast = document.getElementById('toast');

function update() {
  const opt = offer.selectedOptions[0];
  const ok = opt && phone.value.trim();

  send.disabled = !ok;

  price.textContent = opt ? 'Prix : ' + opt.dataset.price : '';
  desc.textContent  = opt ? opt.dataset.desc : '';
}

offer.addEventListener('change', update);
phone.addEventListener('input', update);

send.addEventListener('click', () => {
  const to = phone.value.trim();
  const url = offer.value;
  const msg = `Votre devis SFR : ${url}`;

  window.location.href = `sms:${to}?body=${encodeURIComponent(msg)}`;

  toast.textContent = 'Ouverture de l’application SMS…';
});
</script>

</body>
</html>
