<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client 360</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f2f4f8;
}

/* CENTRE */
.container {
    position: relative;
    height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.client {
    font-size: 70px;
    z-index: 2;
}

/* BOUTONS AUTOUR */
.circle {
    position: absolute;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    cursor: pointer;
    transition: transform 0.2s;
}

.circle:active {
    transform: scale(0.9);
}

.foyer { top: 10%; left: 50%; transform: translateX(-50%); }
.box { left: 10%; top: 50%; transform: translateY(-50%); }
.mobile { right: 10%; top: 50%; transform: translateY(-50%); }

/* PANEL MOBILE (BOTTOM SHEET) */
.panel {
    position: fixed;
    bottom: -100%;
    left: 0;
    width: 100%;
    background: white;
    border-radius: 20px 20px 0 0;
    padding: 20px;
    transition: bottom 0.3s ease;
    box-shadow: 0 -5px 20px rgba(0,0,0,0.2);
}

.panel.active {
    bottom: 0;
}

.panel h3 {
    margin-top: 0;
}

/* INPUT STYLE */
input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border-radius: 10px;
    border: 1px solid #ddd;
    font-size: 16px;
}

/* BOUTON */
.close-btn {
    background: #3498db;
    color: white;
    border: none;
    padding: 12px;
    width: 100%;
    border-radius: 10px;
    font-size: 16px;
}
</style>
</head>

<body>

<div class="container">
    <div class="client">👤</div>

    <div class="circle foyer" onclick="openPanel('foyer')">🏠</div>
    <div class="circle box" onclick="openPanel('box')">📦</div>
    <div class="circle mobile" onclick="openPanel('mobile')">📱</div>
</div>

<!-- FOYER -->
<div id="foyer" class="panel">
    <h3>🏠 Foyer</h3>
    <input placeholder="Nb de personnes">
    <input placeholder="Type de logement">
    <input placeholder="Superficie">
    <input placeholder="Equipements connectés">
    <input placeholder="Intérêts TV">
    <input placeholder="Abonnements TV">
    <button class="close-btn" onclick="closePanel()">Fermer</button>
</div>

<!-- BOX -->
<div id="box" class="panel">
    <h3>📦 Box</h3>
    <input placeholder="Fournisseur">
    <input placeholder="Prix">
    <input placeholder="Technologie">
    <input placeholder="Ligne fixe">
    <input placeholder="Engagement">
    <button class="close-btn" onclick="closePanel()">Fermer</button>
</div>

<!-- MOBILE -->
<div id="mobile" class="panel">
    <h3>📱 Mobile</h3>
    <input placeholder="Opérateur">
    <input placeholder="Prix">
    <input placeholder="Gigas">
    <input placeholder="Engagement">
    <button class="close-btn" onclick="closePanel()">Fermer</button>
</div>

<script>
function openPanel(id) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function closePanel() {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
}
</script>

</body>
</html>
