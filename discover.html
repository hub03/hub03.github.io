<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 1rem; background: #f5f5f5; }
h1 { text-align: center; font-size: 1.5rem; }
form { display: flex; flex-direction: column; gap: 0.8rem; background: #fff; padding: 1rem; border-radius: 1rem; }
.question { display: none; flex-direction: column; gap: 0.5rem; }
input, select, button { padding: 0.5rem; font-size: 1rem; border-radius: 0.5rem; border: 1px solid #ccc; }
button { cursor: pointer; }

#navigation { display: flex; justify-content: flex-end; margin-top: 1rem; gap: 0.5rem; }
#prevBtn { margin-right: auto; background-color: #bbb; color: #fff; border: none; }
#nextBtn { background-color: #4CAF50; color: #fff; border: none; }

.btn-checkbox { display: inline-block; padding: 0.6rem 1.2rem; border: 1px solid #ccc; border-radius: 0.6rem; cursor: pointer; background-color: #f0f0f0; }
input[type="checkbox"]:checked + .btn-checkbox,
input[type="radio"]:checked + .btn-checkbox { background-color: #4CAF50; color: white; border-color: #4CAF50; }

#homeScreen { display:flex; flex-direction:column; gap:1rem; justify-content:center; align-items:center; height:100vh; }
#historyModal, #viewModal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
.modal-content { background: #fff; padding: 1rem; border-radius: 1rem; width: 90%; max-height: 90%; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
th, td { border: 1px solid #ddd; padding: 0.5rem; }
</style>
</head>
<body>

<div id="homeScreen">
  <h1>Discover</h1>
  <button id="newBtn">Nouvelle fiche</button>
  <button id="openHistoryBtn">Historique</button>
</div>

<form id="miniForm" style="display:none;">

<div class="question">
🧑‍🔧 Vous utilisez une ligne à titre professionnel ?
<br><input type="checkbox" id="pro" name="Pro" hidden>
<label for="pro" class="btn-checkbox">Oui ✅</label>
</div>

<div class="question">
🧑‍💻 Vous faites du télétravail ?
<br><input type="checkbox" id="teletravail" name="Télétravail" hidden>
<label for="teletravail" class="btn-checkbox">Oui ✅</label>
</div>

<div class="question">
🧑‍🤝‍🧑 Combien de personnes ?
<br><input type="tel" name="Adultes" placeholder="Adultes">
<br><input type="tel" name="Enfants" placeholder="Enfants">
</div>

<div class="question">
🧱 Maison ou appartement ?
<br><input type="radio" id="maison" name="Logement" hidden>
<label for="maison" class="btn-checkbox">Maison 🏠</label>
<br><input type="radio" id="appartement" name="Logement" hidden>
<label for="appartement" class="btn-checkbox">Appartement 🏢</label>
</div>

<div class="question">
🍿 Vous aimez regarder quoi à la TV ?
<br><input type="text" name="Interets TV">
</div>

<div class="question">
🧟‍♀️ Nom du client ?
<br><input type="text" name="client">
</div>

<div class="question">
<button type="button" id="finishBtn" style="display:none;">Terminer</button>
</div>

<div id="navigation">
<button type="button" id="prevBtn">←</button>
<button type="button" id="nextBtn">Suivant</button>
</div>

</form>

<div id="historyModal"><div class="modal-content"><span id="closeHistory">❌</span><table id="historyTable"><tbody></tbody></table></div></div>

<script>
const form = document.getElementById('miniForm');
const questions = document.querySelectorAll('.question');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const finishBtn = document.getElementById('finishBtn');
let currentIndex = 0;

// AUTO SAVE
function saveProgress() {
  const data = {};
  new FormData(form).forEach((v,k)=>data[k]=v);
  form.querySelectorAll('input[type=checkbox],input[type=radio]').forEach(el=>{
    data[el.name] = el.checked;
  });
  localStorage.setItem('formProgress', JSON.stringify(data));
}

function loadProgress() {
  const saved = JSON.parse(localStorage.getItem('formProgress') || '{}');
  Object.keys(saved).forEach(key => {
    const el = form.elements[key];
    if (!el) return;
    if (el.type === 'checkbox' || el.type === 'radio') {
      el.checked = saved[key];
    } else {
      el.value = saved[key];
    }
  });
}

form.addEventListener('input', saveProgress);

function showQuestion(index) {
  questions.forEach((q,i)=>q.style.display = i===index?'flex':'none');
  prevBtn.style.display = index===0?'none':'inline-block';

  if(index===questions.length-2){
    nextBtn.style.display='none';
    finishBtn.style.display='inline-block';
  } else {
    nextBtn.style.display='inline-block';
    finishBtn.style.display='none';
  }
}

prevBtn.onclick=()=>{ if(currentIndex>0){currentIndex--;showQuestion(currentIndex);} };
nextBtn.onclick=()=>{ if(currentIndex<questions.length-1){currentIndex++;showQuestion(currentIndex);} };
finishBtn.onclick=()=>{
  let history = JSON.parse(localStorage.getItem('miniFormHistory')||'[]');
  const data={};
  new FormData(form).forEach((v,k)=>data[k]=v);
  data.date=new Date().toISOString();
  history.push(data);
  localStorage.setItem('miniFormHistory',JSON.stringify(history));
  localStorage.removeItem('formProgress');
  alert('Sauvegardé');
  form.reset();
  currentIndex=0;
  showQuestion(0);
};

// HOME
const homeScreen = document.getElementById('homeScreen');
document.getElementById('newBtn').onclick=()=>{
  homeScreen.style.display='none';
  form.style.display='flex';
  loadProgress();
  showQuestion(0);
};

document.getElementById('openHistoryBtn').onclick=()=>{
  document.getElementById('historyModal').style.display='flex';
};

document.getElementById('closeHistory').onclick=()=>{
  document.getElementById('historyModal').style.display='none';
};

showQuestion(0);
</script>

</body>
</html>
