<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouvelle fiche</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

  <div class="step active" id="step1">
    <h2>🏠 Foyer</h2>
    <input type="number" placeholder="Nb de personnes" id="nbPersonnes">
    <input type="text" placeholder="Type logement" id="logement">
    <input type="number" placeholder="Superficie" id="superficie">
    <button onclick="nextStep()">Suivant →</button>
  </div>

  <div class="step" id="step2">
    <h2>📡 Box</h2>
    <input type="text" placeholder="FAI" id="fai">
    <input type="number" placeholder="Prix" id="prixBox">
    <button onclick="prevStep()">← Retour</button>
    <button onclick="nextStep()">Suivant →</button>
  </div>

  <div class="step" id="step3">
    <h2>📱 Mobile</h2>
    <input type="text" placeholder="Opérateur" id="operateur">
    <input type="number" placeholder="Prix" id="prixMobile">
    <button onclick="prevStep()">← Retour</button>
    <button onclick="save()">💾 Enregistrer</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
