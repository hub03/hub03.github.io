<h2>Nouvelle fiche</h2>

<form id="discoverForm">

<h3>🏠 Foyer</h3>
<input type="number" placeholder="Nb de personnes" id="nbPersonnes">
<input type="text" placeholder="Type de logement" id="logement">
<input type="number" placeholder="Superficie (m²)" id="superficie">
<input type="text" placeholder="Télétravail" id="teletravail">
<input type="number" placeholder="Nb appareils connectés" id="devices">
<input type="text" placeholder="Intérêts TV" id="tv">
<input type="text" placeholder="Abonnements TV" id="aboTv">
<input type="text" placeholder="Alarme" id="alarme">

<h3>📡 Box</h3>
<input type="text" placeholder="FAI actuel" id="fai">
<input type="number" placeholder="Prix (€)" id="prixBox">
<input type="text" placeholder="Engagement" id="engagementBox">
<input type="text" placeholder="Technologie" id="tech">

<h3>📱 Mobile</h3>
<input type="text" placeholder="Opérateur" id="operateur">
<input type="number" placeholder="Prix (€)" id="prixMobile">
<input type="text" placeholder="Engagement" id="engagementMobile">
<input type="number" placeholder="Go" id="data">
<input type="number" placeholder="Nb autres lignes" id="lignes">

<button type="submit">💾 Enregistrer</button>

</form>

<script src="app.js"></script>
