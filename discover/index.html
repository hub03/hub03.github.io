<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3498db">
<title>Client App</title>

<style>
body {
    margin: 0;
    font-family: -apple-system, sans-serif;
    background: #f2f4f8;
}

/* SCREENS */
.screen {
    display: none;
    padding: 20px;
}

.active {
    display: block;
}

/* HOME */
.home button {
    width: 100%;
    padding: 20px;
    margin: 10px 0;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    background: #3498db;
    color: white;
}

/* CLIENT VIEW */
.container {
    text-align: center;
}

.client {
    font-size: 70px;
}

input {
    width: 90%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 10px;
    border: 1px solid #ddd;
}

/* CIRCLES */
.circle {
    position: absolute;
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.foyer { top: 15%; left: 50%; transform: translateX(-50%); }
.box { left: 10%; top: 50%; transform: translateY(-50%); }
.mobile { right: 10%; top: 50%; transform: translateY(-50%); }

/* PANEL */
.panel {
    position: fixed;
    bottom: -100%;
    left: 0;
    width: 100%;
    background: white;
    border-radius: 20px 20px 0 0;
    padding: 20px;
    transition: 0.3s;
}

.panel.active {
    bottom: 0;
}

/* HISTORIQUE */
.card {
    background: white;
    padding: 15px;
    margin-bottom: 10px;
    border-radius: 10px;
}

/* BACK */
.back {
    margin-bottom: 10px;
}
</style>
</head>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>
<body>

<!-- HOME -->
<div id="home" class="screen active home">
    <h2>Client App</h2>
    <button onclick="goTo('client')">➕ Nouveau client</button>
    <button onclick="loadHistory()">📜 Historique</button>
</div>

<!-- CLIENT -->
<div id="client" class="screen">
    <button class="back" onclick="goTo('home')">⬅ Retour</button>

    <div class="container">
        <div class="client">👤</div>

        <input id="nom" placeholder="Nom">
        <input id="numero" placeholder="Numéro">

        <div class="circle foyer" onclick="openPanel('foyer')">🏠</div>
        <div class="circle box" onclick="openPanel('box')">📦</div>
        <div class="circle mobile" onclick="openPanel('mobile')">📱</div>
    </div>

    <button onclick="saveClient()">💾 Enregistrer</button>
</div>

<!-- HISTORIQUE -->
<div id="history" class="screen">
    <button class="back" onclick="goTo('home')">⬅ Retour</button>
    <h3>Historique</h3>
    <div id="historyList"></div>
</div>

<!-- PANELS -->
<div id="foyer" class="panel">
    <h3>Foyer</h3>
    <input id="f1" placeholder="Nb personnes">
    <input id="f2" placeholder="Logement">
    <button onclick="closePanel()">Fermer</button>
</div>

<div id="box" class="panel">
    <h3>Box</h3>
    <input id="b1" placeholder="Fournisseur">
    <input id="b2" placeholder="Prix">
    <button onclick="closePanel()">Fermer</button>
</div>

<div id="mobile" class="panel">
    <h3>Mobile</h3>
    <input id="m1" placeholder="Opérateur">
    <input id="m2" placeholder="Prix">
    <button onclick="closePanel()">Fermer</button>
</div>

<script>
function goTo(screen) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screen).classList.add('active');
}

/* PANELS */
function openPanel(id) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function closePanel() {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
}

/* SAVE CLIENT */
function saveClient() {
    let client = {
        nom: document.getElementById("nom").value,
        numero: document.getElementById("numero").value,
        foyer: document.getElementById("f1").value,
        box: document.getElementById("b1").value,
        mobile: document.getElementById("m1").value
    };

    let data = JSON.parse(localStorage.getItem("clients") || "[]");
    data.push(client);
    localStorage.setItem("clients", JSON.stringify(data));

    alert("Client enregistré !");
    goTo('home');
}

/* LOAD HISTORY */
function loadHistory() {
    goTo('history');

    let data = JSON.parse(localStorage.getItem("clients") || "[]");
    let container = document.getElementById("historyList");
    container.innerHTML = "";

    data.forEach(c => {
        container.innerHTML += `
            <div class="card">
                <strong>${c.nom}</strong><br>
                📞 ${c.numero}<br>
                🏠 ${c.foyer}<br>
                📦 ${c.box}<br>
                📱 ${c.mobile}
            </div>
        `;
    });
}
</script>

</body>
</html>
