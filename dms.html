<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 320px;
            width: 100%;
        }
        input {
            width: 80%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #2a2a2a;
            color: #fff;
            font-size: 16px;
            text-align: center;
        }
        button {
            width: 88%;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #0056b3; }
        #status {
            margin-top: 15px;
            font-weight: bold;
        }
        .success { color: #4CAF50; }
        .error { color: #F44336; }
    </style>
</head>
<body>

<div class="card">
    <h2>Dead Man Switch</h2>
    <input type="password" id="secretCode" placeholder="Code Secret">
    <button onclick="sendCheckIn()">Valider ma présence</button>
    <div id="status"></div>
</div>

<script>
    // Remplacez par l'URL fournie lors du déploiement de votre Google Apps Script
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyKKwEUBYMy5TupAnLl2_DGI6-qSeNnB491so3TdPpNQS0f0AjAFaiKDkpYNDurVO1w/exec";

    async function sendCheckIn() {
        const code = document.getElementById('secretCode').value;
        const statusDiv = document.getElementById('status');
        
        statusDiv.className = '';
        statusDiv.innerText = "Vérification en cours...";

        try {
            const response = await fetch(SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" }, // Évite les soucis CORS avec Apps Script
                body: JSON.stringify({ code: code })
            });

            const result = await JSON.parse(await response.text());

            if (result.success) {
                const date = new Date(result.newDeadline).toLocaleDateString("fr-FR");
                statusDiv.className = 'success';
                statusDiv.innerText = "OK ! Repoussé au " + date;
            } else {
                statusDiv.className = 'error';
                statusDiv.innerText = "ÉCHEC : " + result.error;
            }
        } catch (err) {
            statusDiv.className = 'error';
            statusDiv.innerText = "Erreur de connexion au serveur.";
        }
    }
</script>

</body>
</html>
