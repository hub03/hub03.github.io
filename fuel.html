<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flux d'énergie</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #f7f7f5;
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
}

.app {
    width: min(1000px, 92vw);
}

header {
    text-align: center;
    margin-bottom: 50px;
}

h1 {
    font-size: 24px;
    font-weight: 400;
    margin: 0 0 10px;
}

.subtitle {
    font-size: 13px;
    color: #888;
}

/* =========================
   SCÈNE
========================= */

.scene {
    position: relative;
    height: 300px;
    overflow: hidden;
}

/* Ligne du câble */

.cable {
    position: absolute;
    left: 115px;
    right: 235px;
    top: 50%;
    height: 2px;
    background: #ddd;
}

/* Prise */

.plug {
    position: absolute;
    left: 30px;
    top: 50%;
    transform: translateY(-50%);
    width: 60px;
    height: 80px;
}

.plug-body {
    position: absolute;
    left: 0;
    top: 10px;
    width: 42px;
    height: 60px;
    border: 3px solid #111;
    border-radius: 8px;
}

.pin {
    position: absolute;
    left: 38px;
    width: 20px;
    height: 6px;
    background: #111;
    border-radius: 3px;
}

.pin.one {
    top: 24px;
}

.pin.two {
    top: 48px;
}

/* =========================
   VOITURE
========================= */

.car {
    position: absolute;
    right: 30px;
    top: 50%;
    transform: translateY(-50%);
    width: 180px;
    height: 90px;
}

.car-body {
    position: absolute;
    bottom: 15px;
    left: 0;
    width: 180px;
    height: 48px;
    background: #111;
    border-radius: 18px 25px 10px 10px;
}

.car-roof {
    position: absolute;
    left: 42px;
    top: 5px;
    width: 95px;
    height: 43px;
    background: #111;
    border-radius: 50px 50px 0 0;
}

.window {
    position: absolute;
    left: 55px;
    top: 13px;
    width: 68px;
    height: 24px;
    background: #f7f7f5;
    border-radius: 30px 30px 4px 4px;
}

.wheel {
    position: absolute;
    bottom: 0;
    width: 30px;
    height: 30px;
    background: #111;
    border-radius: 50%;
    border: 6px solid #f7f7f5;
    box-shadow: 0 0 0 2px #111;
}

.wheel.left {
    left: 25px;
}

.wheel.right {
    right: 25px;
}

/* =========================
   PARTICULES
========================= */

#particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

.particle {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #111;
    transform: translate(-50%, -50%);
    will-change: transform;
}

/*
   Petite traînée derrière les particules
*/

.particle::after {
    content: "";
    position: absolute;
    width: 18px;
    height: 1px;
    background: #111;
    right: 4px;
    top: 2px;
    opacity: .15;
}

/* =========================
   CONTRÔLES
========================= */

.controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 25px;
}

button {
    appearance: none;
    border: 1px solid #111;
    background: transparent;
    color: #111;
    padding: 12px 20px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    transition: all .2s ease;
}

button:hover {
    background: #111;
    color: white;
}

button.active {
    background: #111;
    color: white;
}

.info {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #888;
}

.info strong {
    color: #111;
    font-weight: 500;
}

/* Mobile */

@media (max-width: 600px) {

    .scene {
        height: 250px;
    }

    .cable {
        left: 90px;
        right: 190px;
    }

    .plug {
        left: 10px;
        transform: translateY(-50%) scale(.8);
    }

    .car {
        right: 5px;
        transform: translateY(-50%) scale(.8);
    }

    .controls {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="app">

    <header>
        <h1>Flux d'énergie</h1>
        <div class="subtitle">
            Visualisation de la charge d'une voiture électrique
        </div>
    </header>

    <div class="scene">

        <div class="cable"></div>

        <!-- PRISE -->
        <div class="plug">
            <div class="plug-body"></div>
            <div class="pin one"></div>
            <div class="pin two"></div>
        </div>

        <!-- PARTICULES -->
        <div id="particles"></div>

        <!-- VOITURE -->
        <div class="car">

            <div class="car-roof"></div>
            <div class="window"></div>
            <div class="car-body"></div>

            <div class="wheel left"></div>
            <div class="wheel right"></div>

        </div>

    </div>

    <div class="controls">

        <button id="home">
            Charge domestique · 3 kW
        </button>

        <button id="fast">
            Charge rapide · 150 kW
        </button>

    </div>

    <div class="info" id="info">
        Sélectionnez un mode de charge
    </div>

</div>


<script>

const container = document.getElementById("particles");

const homeButton = document.getElementById("home");
const fastButton = document.getElementById("fast");

const info = document.getElementById("info");

let mode = null;
let particles = [];

let lastTime = performance.now();
let spawnAccumulator = 0;


/*
    Les valeurs réelles utilisées dans la métaphore :

    3 kW   → 6 gouttes / seconde
    150 kW → 300 gouttes / seconde

    Ratio = 50x
*/


const modes = {

    home: {
        dropsPerSecond: 6,
        label: "Charge domestique",
        power: "3 kW"
    },

    fast: {
        dropsPerSecond: 300,
        label: "Charge rapide",
        power: "150 kW"
    }

};


/*
    Crée une particule.
*/

function createParticle() {

    const particle = document.createElement("div");

    particle.className = "particle";

    const sceneWidth = container.parentElement.clientWidth;

    particle.x = 115;
    particle.y = container.parentElement.clientHeight / 2;

    /*
        Petite variation verticale pour éviter
        un flux parfaitement mécanique.
    */

    particle.offsetY = (Math.random() - 0.5) * 5;

    particle.speed = 450 + Math.random() * 100;

    particle.element = particle;

    particle.style.left = particle.x + "px";
    particle.style.top = particle.y + particle.offsetY + "px";

    container.appendChild(particle);

    particles.push(particle);
}


/*
    Animation principale.

    Au lieu de créer 300 DOM elements par seconde,
    on maintient un flux continu.

    Cela donne une animation beaucoup plus fluide
    tout en conservant le ratio visuel.
*/

function animate(time) {

    const delta = Math.min(
        (time - lastTime) / 1000,
        0.05
    );

    lastTime = time;

    if (mode) {

        const settings = modes[mode];

        spawnAccumulator += settings.dropsPerSecond * delta;

        /*
            Création des particules correspondant
            au nombre théorique de gouttes.
        */

        while (spawnAccumulator >= 1) {

            createParticle();

            spawnAccumulator--;

        }
    }

    /*
        Déplacement des particules.
    */

    for (let i = particles.length - 1; i >= 0; i--) {

        const p = particles[i];

        p.x += p.speed * delta;

        p.element.style.transform =
            `translate(${p.x - 115}px, ${p.offsetY}px)`;

        /*
            Suppression lorsqu'elles atteignent la voiture.
        */

        if (p.x > container.parentElement.clientWidth - 210) {

            p.element.remove();

            particles.splice(i, 1);
        }
    }

    requestAnimationFrame(animate);
}


/*
    Sélection du mode.
*/

function setMode(newMode) {

    mode = newMode;

    homeButton.classList.toggle(
        "active",
        newMode === "home"
    );

    fastButton.classList.toggle(
        "active",
        newMode === "fast"
    );

    const settings = modes[newMode];

    info.innerHTML =
        `<strong>${settings.label}</strong> · ` +
        `${settings.power} · ` +
        `≈ ${settings.dropsPerSecond} gouttes/seconde`;

    /*
        Nettoyage du flux précédent.
    */

    particles.forEach(p => p.element.remove());

    particles = [];

    spawnAccumulator = 0;
}


homeButton.addEventListener(
    "click",
    () => setMode("home")
);

fastButton.addEventListener(
    "click",
    () => setMode("fast")
);


/*
    Démarrage du moteur d'animation.
*/

requestAnimationFrame(animate);

</script>

</body>
</html>
