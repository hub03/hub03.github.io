<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Globe Wireframe Animé</title>
  <style>
    :root {
      --bg: #0f172a;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --border: #334155;
    }

    body {
      background-color: var(--bg);
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .globe-container {
      width: 300px;
      height: 300px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      filter: drop-shadow(0 0 15px var(--accent-glow));
    }
  </style>
</head>
<body>

  <div class="globe-container">
    <canvas id="globeCanvas" width="300" height="300"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('globeCanvas');
    const ctx = canvas.getContext('2d');

    const width = canvas.width;
    const height = canvas.height;
    const cx = width / 2;
    const cy = height / 2;
    const radius = 110;

    // Inclinaison axiale (~23.44°)
    const tilt = 23.44 * (Math.PI / 180);

    function drawGlobe() {
      ctx.clearRect(0, 0, width, height);

      const now = new Date();
      // Secondes écoulées aujourd'hui + millisecondes pour une fluidité parfaite
      const secondsInDay = (now.getUTCHours() * 3600) + 
                           (now.getUTCMinutes() * 60) + 
                           now.getUTCSeconds() + 
                           (now.getUTCMilliseconds() / 1000);

      // Facteur d'accélération (ex: 5760 = 1 tour complet en 15s)
      const SPEED_FACTOR = 5760;
      const rotationAngle = ((secondsInDay * SPEED_FACTOR) / 86400) * (2 * Math.PI);

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(tilt); // Applique l'inclinaison axiale terrestre

      // 1. Contour du globe
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // 2. Axe de rotation (pointillé)
      ctx.beginPath();
      ctx.moveTo(0, -radius - 15);
      ctx.lineTo(0, radius + 15);
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);

      // 3. Parallèles (Latitudes)
      const parallels = [-60, -30, 0, 30, 60];
      parallels.forEach(lat => {
        const radLat = lat * (Math.PI / 180);
        const y = -radius * Math.sin(radLat);
        const rLat = radius * Math.cos(radLat);

        ctx.beginPath();
        ctx.ellipse(0, y, rLat, rLat * 0.3, 0, 0, Math.PI * 2);
        ctx.strokeStyle = lat === 0 ? 'rgba(56, 189, 248, 0.6)' : 'rgba(148, 163, 184, 0.2)';
        ctx.lineWidth = lat === 0 ? 1.2 : 0.8;
        ctx.stroke();
      });

      // 4. Méridiens (Longitudes en rotation)
      const meridianCount = 12;
      for (let i = 0; i < meridianCount; i++) {
        const angle = rotationAngle + (i * (Math.PI * 2 / meridianCount));
        const xOffset = Math.sin(angle) * radius;

        // Affiche la face avant du globe
        if (Math.cos(angle) > 0) {
          ctx.beginPath();
          ctx.ellipse(0, 0, Math.abs(xOffset), radius, 0, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }

      ctx.restore();

      requestAnimationFrame(drawGlobe);
    }

    drawGlobe();
  </script>
</body>
</html>
