<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Liens de rappel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* --- Base --- */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea, #764ba2);
      background-size: 200% 200%;
      animation: gradientShift 10s ease infinite;
      color: #fff;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #app {
      width: 90%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      border-radius: 20px;
      padding: 30px 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* --- Boutons et liens --- */
    .btn, .link {
      display: block;
      padding: 15px 20px;
      margin: 12px 0;
      border-radius: 14px;
      font-size: 17px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.25s ease;
    }

    .btn {
      background: rgba(255, 255, 255, 0.2);
      cursor: pointer;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: translateY(-2px);
    }

    .link {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .link:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    /* --- Retour --- */
    .back {
      font-size: 15px;
      color: rgba(255,255,255,0.8);
      margin-bottom: 20px;
      cursor: pointer;
      text-align: left;
      transition: color 0.2s ease;
    }

    .back:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const data = {
      root: [
        { id: "S", label: "SFR" },
        { id: "R", label: "RED" }
      ],
      S: [
        { label: "Déménagement", url: "https://appel.sfr.fr/webcallback_form?CAMPAIGN_ID=591bf8d780df1a8d4a8b4567" },
        { label: "Technique FTTH", url: "https://appel.sfr.fr/webcallback_form?CAMPAIGN_ID=59089f4280df1a45398b4567" },
        { label: "Résiliation", url: "https://appel.sfr.fr/webcallback_form?CAMPAIGN_ID=60ae5e5b3735652fb8000000" },
        { label: "Réclamation conso box", url: "tel:0171251186" }
      ],
      R: [
        { label: "Déménagement", url: "https://c.sfr.fr/red-demenagement/" },
        { label: "Résiliation box", url: "https://c.sfr.fr/red-service-resiliation" },
        { label: "Technique box", url: "https://c.sfr.fr/conseiller_technique_RED" }
      ]
    };

    const app = document.getElementById("app");
    let historyStack = [];

    function renderMenu(id = "root") {
      app.innerHTML = "";
      if (id !== "root") {
        const back = document.createElement("div");
        back.className = "back";
        back.textContent = "← Retour";
        back.onclick = () => {
          renderMenu(historyStack.pop() || "root");
        };
        app.appendChild(back);
      }

      data[id].forEach(item => {
        if (item.url) {
          const a = document.createElement("a");
          a.href = item.url;
          a.target = "_blank";
          a.className = "link";
          a.textContent = item.label;
          app.appendChild(a);
        } else {
          const btn = document.createElement("div");
          btn.className = "btn";
          btn.textContent = item.label;
          btn.onclick = () => {
            historyStack.push(id);
            renderMenu(item.id);
          };
          app.appendChild(btn);
        }
      });
    }

    renderMenu();
  </script>
</body>
</html>
