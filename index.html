<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📅</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --today-bg: #0284c7;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .help-btn {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      z-index: 100;
    }

    .help-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      max-width: 650px;
      width: 100%;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .modal-header {
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .lang-select {
      background: var(--bg);
      color: var(--accent);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }

    .close-btn:hover {
      color: var(--text);
    }

    .modal-body {
      padding: 1.5rem;
      overflow-y: auto;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .modal-body h2 {
      color: var(--accent);
      font-size: 1.4rem;
      margin-bottom: 0.8rem;
    }

    .modal-body h3 {
      color: var(--text);
      font-size: 1.1rem;
      margin: 1.2rem 0 0.4rem 0;
    }

    .modal-body p {
      margin-bottom: 0.8rem;
    }

    .modal-body ul {
      margin-left: 1.2rem;
      margin-bottom: 0.8rem;
    }

    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2rem 3rem;
      text-align: center;
      box-shadow: 0 10px 30px var(--accent-glow);
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s, border-color 0.2s;
      max-width: 600px;
      width: 100%;
      margin-top: 1rem;
    }

    .hero-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .clock {
      font-size: 3rem;
      font-weight: 800;
      font-family: monospace;
      color: var(--accent);
      margin-bottom: 0.8rem;
    }

    .current-date {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
    }

    /* Style du conteneur du globe */
    .globe-wrapper {
      margin-top: 3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s ease;
    }

    .globe-wrapper.hidden {
      display: none;
    }

    canvas {
      filter: drop-shadow(0 0 15px var(--accent-glow));
    }

    .year-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin: 2rem 0 1.5rem 0;
      width: 100%;
      max-width: 1000px;
    }

    .nav-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 1.2rem;
      font-weight: bold;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }

    .nav-btn:hover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    .year-display {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
    }

    .calendar-container {
      width: 100%;
      max-width: 1000px;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .calendar-container.visible {
      display: flex;
    }

    .calendar-rows {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
    }

    .season-row {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      transition: border-color 0.2s;
    }

    .season-row:hover {
      border-color: var(--accent);
    }

    .season-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--accent);
    }

    .months-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.2rem;
    }

    @media (max-width: 768px) {
      .months-container {
        grid-template-columns: 1fr;
      }
    }

    .month-card {
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--border);
      border-radius: 0.8rem;
      padding: 0.8rem;
      display: flex;
      flex-direction: column;
    }

    .month-label {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 0.6rem;
      text-align: center;
      border-bottom: 1px dashed var(--border);
      padding-bottom: 0.4rem;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.3rem;
      text-align: center;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      border-radius: 0.4rem;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
    }

    .day-cell.today {
      background: var(--today-bg);
      color: #fff;
      font-weight: 800;
      box-shadow: 0 0 12px var(--accent);
    }
  </style>
</head>
<body>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">

        pYear: "Нулевой год — падение Чикшулубского метеорита (~66 038 000 лет назад).",
        hDay: "Происхождение 1-го дня (Перигелий)",
        pDay: "1-й день года — перигелий Земли (~4 января).",
        hGrid: "Структура: 5 Сезонов (S1-S5) × 3 Месяца (M1-M3)",
        pGrid: "Год состоит из 5 сезонов по 73 дня. Названия дней упразднены.",
        li1: "Сезоны: 5 основных строк с S1 по S5.",
        li2: "Месяцы: M1 и M2 содержат по 25 дней (D1-D25), M3 — 23 дня (D1-D23).",

    const CENOZOIC_BASE = 66038000;
    let currentGregorianYear = new Date().getFullYear();
    let selectedGregorianYear = currentGregorianYear;
    let isGlobeActive = true;
    let animFrameId = null;

    function getCenozoicYear(gregorianYear) {
      return CENOZOIC_BASE + (gregorianYear - 1950);
    }

    function formatYear(year) {
      return year.toLocaleString('fr-FR');
    }

    function isLeapYear(year) {
      return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
    }

    function getOrbitalDay(date) {
      const year = date.getFullYear();
      let perihelion = new Date(year, 0, 4);
      
      let start = perihelion;
      if (date < perihelion) {
        start = new Date(year - 1, 0, 4);
      }
      
      const diff = date - start;
      const oneDay = 1000 * 60 * 60 * 24;
      return Math.floor(diff / oneDay) + 1;
    }

    function convertToFixedDate(date) {
      const dayOfYear = getOrbitalDay(date);
      const cenozoicYear = getCenozoicYear(date.getFullYear());
      
      if (dayOfYear <= 365) {
        const seasonIndex = Math.floor((dayOfYear - 1) / 73) + 1;
        const dayOfSeason = ((dayOfYear - 1) % 73) + 1;
        
        let monthInSeason = 1;
        let dayInMonth = dayOfSeason;

        if (dayOfSeason > 50) {
          monthInSeason = 3;
          dayInMonth = dayOfSeason - 50;
        } else if (dayOfSeason > 25) {
          monthInSeason = 2;
          dayInMonth = dayOfSeason - 25;
        }

        return {
          season: seasonIndex,
          month: monthInSeason,
          day: dayInMonth,
          year: cenozoicYear
        };
      } else {
        return {
          season: 5,
          month: 3,
          day: 24,
          year: cenozoicYear
        };
      }
    }

    function updateClockAndHeader() {
      const now = new Date();
      const hrs = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hrs}:${mins}:${secs}`;

      const fixed = convertToFixedDate(now);
      const dateString = `${formatYear(fixed.year)} / S${fixed.season} / M${fixed.month} / D${fixed.day}`;
      document.getElementById('current-fixed-date').textContent = dateString;
    }

    function renderCalendar() {
      const container = document.getElementById('calendar-rows');
      container.innerHTML = '';
      
      const displayedCenozoicYear = getCenozoicYear(selectedGregorianYear);
      document.getElementById('displayed-year').textContent = formatYear(displayedCenozoicYear);

      const now = new Date();
      const fixedToday = convertToFixedDate(now);
      const leap = isLeapYear(selectedGregorianYear);

      for (let s = 1; s <= 5; s++) {
        const seasonRow = document.createElement('div');
        seasonRow.className = 'season-row';

        const title = document.createElement('div');
        title.className = 'season-title';
        title.textContent = `S${s}`;
        seasonRow.appendChild(title);

        const monthsContainer = document.createElement('div');
        monthsContainer.className = 'months-container';

        const m3Days = (s === 5 && leap) ? 24 : 23;

        const monthsConfig = [
          { m: 1, totalDays: 25 },
          { m: 2, totalDays: 25 },
          { m: 3, totalDays: m3Days }
        ];

        monthsConfig.forEach(cfg => {
          const monthCard = document.createElement('div');
          monthCard.className = 'month-card';

          const monthLabel = document.createElement('div');
          monthLabel.className = 'month-label';
          monthLabel.textContent = `M${cfg.m}`;
          monthCard.appendChild(monthLabel);

          const daysGrid = document.createElement('div');
          daysGrid.className = 'days-grid';

          for (let d = 1; d <= cfg.totalDays; d++) {
            const cell = document.createElement('div');
            cell.className = 'day-cell';
            cell.textContent = d;

            if (selectedGregorianYear === now.getFullYear() && fixedToday.season === s && fixedToday.month === cfg.m && fixedToday.day === d) {
              cell.classList.add('today');
            }
            daysGrid.appendChild(cell);
          }

          monthCard.appendChild(daysGrid);
          monthsContainer.appendChild(monthCard);
        });

        seasonRow.appendChild(monthsContainer);
        container.appendChild(seasonRow);
      }
    }

    /* Logic du Globe Wireframe */
    const canvas = document.getElementById('globeCanvas');
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;
    const cx = width / 2;
    const cy = height / 2;
    const radius = 100;
    const tilt = 23.44 * (Math.PI / 180);

    function drawGlobe() {
      if (!isGlobeActive) return;

      ctx.clearRect(0, 0, width, height);

      const now = new Date();
      const secondsInDay = (now.getUTCHours() * 3600) + 
                           (now.getUTCMinutes() * 60) + 
                           now.getUTCSeconds() + 
                           (now.getUTCMilliseconds() / 1000);

      // Vitesse ralentie de moitié : 2880 (1 tour complet en ~30s)
      const SPEED_FACTOR = 2880;
      const rotationAngle = ((secondsInDay * SPEED_FACTOR) / 86400) * (2 * Math.PI);

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(tilt);

      // Silhouette du globe
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Axe de rotation (pointillé)
      ctx.beginPath();
      ctx.moveTo(0, -radius - 12);
      ctx.lineTo(0, radius + 12);
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Parallèles (Latitudes)
      const parallels = [-60, -30, 0, 30, 60];
      parallels.forEach(lat => {
        const radLat = lat * (Math.PI / 180);
        const y = -radius * Math.sin(radLat);
        const rLat = radius * Math.cos(radLat);

        ctx.beginPath();
        ctx.ellipse(0, y, rLat, rLat * 0.3, 0, 0, Math.PI * 2);
        ctx.strokeStyle = lat === 0 ? 'rgba(56, 189, 248, 0.6)' : 'rgba(148, 163, 184, 0.2)';
        ctx.lineWidth = lat === 0 ? 1.2 : 0.8;
        ctx.stroke();
      });

      // Méridiens (Longitudes)
      const meridianCount = 12;
      for (let i = 0; i < meridianCount; i++) {
        const angle = rotationAngle + (i * (Math.PI * 2 / meridianCount));
        const xOffset = Math.sin(angle) * radius;

        if (Math.cos(angle) > 0) {
          ctx.beginPath();
          ctx.ellipse(0, 0, Math.abs(xOffset), radius, 0, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }

      ctx.restore();

      animFrameId = requestAnimationFrame(drawGlobe);
    }

    function updateModalLanguage(lang) {
      const data = I18N[lang] || I18N.fr;
      const content = document.getElementById('modal-content');
      content.innerHTML = `
        <h2>${data.title}</h2>
        <p>${data.intro}</p>
        <h3>${data.hYear}</h3>
        <p>${data.pYear}</p>
        <h3>${data.hDay}</h3>
        <p>${data.pDay}</p>
        <h3>${data.hGrid}</h3>
        <p>${data.pGrid}</p>
        <ul>
          <li>${data.li1}</li>
          <li>${data.li2}</li>
          <li>${data.li3}</li>
        </ul>
      `;
    }

    document.getElementById('open-help').addEventListener('click', () => {
      document.getElementById('modal-overlay').classList.add('visible');
    });

    document.getElementById('close-help').addEventListener('click', () => {
      document.getElementById('modal-overlay').classList.remove('visible');
    });

    document.getElementById('modal-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'modal-overlay') {
        document.getElementById('modal-overlay').classList.remove('visible');
      }
    });

    document.getElementById('lang-select').addEventListener('change', (e) => {
      updateModalLanguage(e.target.value);
    });

    // Basculement Calendrier <-> Globe
    document.getElementById('hero-card').addEventListener('click', () => {
      const calendarContainer = document.getElementById('calendar-container');
      const globeWrapper = document.getElementById('globe-wrapper');
      
      const isCalendarVisible = calendarContainer.classList.toggle('visible');

      if (isCalendarVisible) {
        // Masquer le globe
        globeWrapper.classList.add('hidden');
        isGlobeActive = false;
        if (animFrameId) cancelAnimationFrame(animFrameId);
      } else {
        // Réafficher le globe
        globeWrapper.classList.remove('hidden');
        isGlobeActive = true;
        drawGlobe();
      }
    });

    document.getElementById('prev-year').addEventListener('click', () => {
      selectedGregorianYear--;
      renderCalendar();
    });

    document.getElementById('next-year').addEventListener('click', () => {
      selectedGregorianYear++;
      renderCalendar();
    });

    updateModalLanguage('fr');
    renderCalendar();
    updateClockAndHeader();
    setInterval(updateClockAndHeader, 1000);
    drawGlobe();
  </script>
</body>
</html>
