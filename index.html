<!DOCTYPE html>
<html lang="und">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📅</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --today-bg: #0284c7;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Hero Card pliable */
    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2rem 3rem;
      text-align: center;
      box-shadow: 0 10px 30px var(--accent-glow);
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s, border-color 0.2s;
      max-width: 500px;
      width: 100%;
    }

    .hero-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .clock {
      font-size: 3rem;
      font-weight: 800;
      font-family: monospace;
      color: var(--accent);
      margin-bottom: 0.8rem;
    }

    .current-date {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
    }

    /* Barre de navigation d'année */
    .year-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin: 2rem 0 1.5rem 0;
      width: 100%;
      max-width: 1200px;
    }

    .nav-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 1.2rem;
      font-weight: bold;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }

    .nav-btn:hover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    .year-display {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
    }

    /* Conteneur rétractable du calendrier */
    .calendar-container {
      width: 100%;
      max-width: 1200px;
      display: none; /* Masqué par défaut */
      flex-direction: column;
      align-items: center;
    }

    .calendar-container.visible {
      display: flex;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
      width: 100%;
    }

    .month-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.2rem;
      transition: transform 0.2s, border-color 0.2s;
    }

    .month-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .month-card.month-x {
      border: 1px dashed var(--accent);
      background: rgba(56, 189, 248, 0.05);
    }

    .month-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 1rem;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .days-header, .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.3rem;
      text-align: center;
    }

    .days-header span {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      padding-bottom: 0.4rem;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      border-radius: 0.4rem;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
    }

    .day-cell.today {
      background: var(--today-bg);
      color: #fff;
      font-weight: 800;
      box-shadow: 0 0 12px var(--accent);
    }
  </style>
</head>
<body>

  <div class="hero-card" id="hero-card">
    <div class="clock" id="clock">00:00:00</div>
    <div class="current-date" id="current-fixed-date">---</div>
  </div>

  <div class="calendar-container" id="calendar-container">
    
    <div class="year-nav">
      <button class="nav-btn" id="prev-year">&lt;</button>
      <div class="year-display" id="displayed-year">2026</div>
      <button class="nav-btn" id="next-year">&gt;</button>
    </div>

    <div class="calendar-grid" id="calendar-grid"></div>
  </div>

  <script>
    const DAY_LABELS = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
    let selectedYear = new Date().getFullYear();
    
    function isLeapYear(year) {
      return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
    }

    function getDayOfYear(date) {
      const start = new Date(date.getFullYear(), 0, 0);
      const diff = date - start;
      const oneDay = 1000 * 60 * 60 * 24;
      return Math.floor(diff / oneDay);
    }

    function convertToFixedDate(date) {
      const dayOfYear = getDayOfYear(date);
      
      if (dayOfYear <= 364) {
        const monthIndex = Math.floor((dayOfYear - 1) / 28);
        const dayOfMonth = ((dayOfYear - 1) % 28) + 1;
        const dayOfWeekIndex = (dayOfMonth - 1) % 7;
        return {
          month: monthIndex + 1,
          day: dayOfMonth,
          dayLabel: DAY_LABELS[dayOfWeekIndex],
          isX: false,
          year: date.getFullYear()
        };
      } else {
        const xDay = dayOfYear - 364;
        return {
          month: '✖️',
          day: xDay,
          dayLabel: `✖️`,
          isX: true,
          year: date.getFullYear()
        };
      }
    }

    function updateClockAndHeader() {
      const now = new Date();
      
      // Horloge
      const hrs = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hrs}:${mins}:${secs}`;

      // Date au format AAAA / MM / JJ
      const fixed = convertToFixedDate(now);
      const dateString = `${fixed.year} / ${fixed.month} / ${fixed.day} ${fixed.dayLabel}`;
      
      document.getElementById('current-fixed-date').textContent = dateString;

      return fixed;
    }

    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';
      
      document.getElementById('displayed-year').textContent = selectedYear;

      const now = new Date();
      const fixedToday = convertToFixedDate(now);
      const leap = isLeapYear(selectedYear);

      // Render 13 Mois
      for (let m = 1; m <= 13; m++) {
        const card = document.createElement('div');
        card.className = 'month-card';

        const title = document.createElement('div');
        title.className = 'month-title';
        title.textContent = `${m}`;
        card.appendChild(title);

        const header = document.createElement('div');
        header.className = 'days-header';
        DAY_LABELS.forEach(label => {
          const span = document.createElement('span');
          span.textContent = label;
          header.appendChild(span);
        });
        card.appendChild(header);

        const daysGrid = document.createElement('div');
        daysGrid.className = 'days-grid';

        for (let d = 1; d <= 28; d++) {
          const cell = document.createElement('div');
          cell.className = 'day-cell';
          cell.textContent = d;

          // Surligner le jour actuel uniquement si l'année affichée est l'année courante
          if (selectedYear === now.getFullYear() && !fixedToday.isX && fixedToday.month === m && fixedToday.day === d) {
            cell.classList.add('today');
          }
          daysGrid.appendChild(cell);
        }

        card.appendChild(daysGrid);
        grid.appendChild(card);
      }

      // Render Mois X
      const cardX = document.createElement('div');
      cardX.className = 'month-card month-x';

      const titleX = document.createElement('div');
      titleX.className = 'month-title';
      titleX.textContent = `✖️`;
      cardX.appendChild(titleX);

      const daysGridX = document.createElement('div');
      daysGridX.className = 'days-grid';

      const totalXDays = leap ? 2 : 1;
      for (let x = 1; x <= totalXDays; x++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        cell.textContent = `✖️${x}`;

        if (selectedYear === now.getFullYear() && fixedToday.isX && fixedToday.day === x) {
          cell.classList.add('today');
        }
        daysGridX.appendChild(cell);
      }

      cardX.appendChild(daysGridX);
      grid.appendChild(cardX);
    }

    // Toggle Affichage du calendrier
    document.getElementById('hero-card').addEventListener('click', () => {
      const container = document.getElementById('calendar-container');
      container.classList.toggle('visible');
    });

    // Navigation d'année
    document.getElementById('prev-year').addEventListener('click', () => {
      selectedYear--;
      renderCalendar();
    });

    document.getElementById('next-year').addEventListener('click', () => {
      selectedYear++;
      renderCalendar();
    });

    renderCalendar();
    updateClockAndHeader();
    setInterval(updateClockAndHeader, 1000);
  </script>
</body>
</html>
