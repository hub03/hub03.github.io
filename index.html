<!DOCTYPE html>
<html lang="und">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📅 5×73</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --today-bg: #0284c7;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Bloc principal cliquable */
    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2rem 3rem;
      text-align: center;
      box-shadow: 0 10px 30px var(--accent-glow);
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s, border-color 0.2s;
      max-width: 600px;
      width: 100%;
    }

    .hero-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .clock {
      font-size: 3rem;
      font-weight: 800;
      font-family: monospace;
      color: var(--accent);
      margin-bottom: 0.8rem;
    }

    .current-date {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
    }

    /* Navigation d'année */
    .year-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      margin: 2rem 0 1.5rem 0;
      width: 100%;
      max-width: 1200px;
    }

    .nav-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--accent);
      font-size: 1.2rem;
      font-weight: bold;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }

    .nav-btn:hover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    .year-display {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text);
    }

    /* Conteneur rétractable */
    .calendar-container {
      width: 100%;
      max-width: 1200px;
      display: none;
      flex-direction: column;
      align-items: center;
    }

    .calendar-container.visible {
      display: flex;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      width: 100%;
    }

    .month-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.2rem;
      transition: transform 0.2s, border-color 0.2s;
    }

    .month-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .month-card.month-x {
      border: 1px dashed var(--accent);
      background: rgba(56, 189, 248, 0.05);
      grid-column: 1 / -1;
      max-width: 300px;
      margin: 0 auto;
    }

    .month-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 1rem;
      text-align: center;
    }

    .days-header, .days-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.3rem;
      text-align: center;
    }

    .days-header span {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      padding-bottom: 0.4rem;
    }

    .day-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      border-radius: 0.4rem;
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
    }

    .day-cell.today {
      background: var(--today-bg);
      color: #fff;
      font-weight: 800;
      box-shadow: 0 0 12px var(--accent);
    }
  </style>
</head>
<body>

  <div class="hero-card" id="hero-card">
    <div class="clock" id="clock">00:00:00</div>
    <div class="current-date" id="current-fixed-date">---</div>
  </div>

  <div class="calendar-container" id="calendar-container">
    <div class="year-nav">
      <button class="nav-btn" id="prev-year">&lt;</button>
      <div class="year-display" id="displayed-year">---</div>
      <button class="nav-btn" id="next-year">&gt;</button>
    </div>

    <div class="calendar-grid" id="calendar-grid"></div>
  </div>

  <script>
    const DAY_LABELS = ['A', 'B', 'C', 'D', 'E']; // Semaine de 5 jours
    const CENOZOIC_BASE = 66038000;
    
    let currentGregorianYear = new Date().getFullYear();
    let selectedGregorianYear = currentGregorianYear;

    function getCenozoicYear(gregorianYear) {
      return CENOZOIC_BASE + (gregorianYear - 1950);
    }

    function formatYear(year) {
      return year.toLocaleString('fr-FR');
    }

    function isLeapYear(year) {
      return (year % 4 === 0 && year % 100 !== 0) || (year % 400 === 0);
    }

    function getDayOfYear(date) {
      const start = new Date(date.getFullYear(), 0, 0);
      const diff = date - start;
      const oneDay = 1000 * 60 * 60 * 24;
      return Math.floor(diff / oneDay);
    }

    function convertToFixedDate(date) {
      const dayOfYear = getDayOfYear(date);
      const cenozoicYear = getCenozoicYear(date.getFullYear());
      
      if (dayOfYear <= 365) {
        const monthIndex = Math.floor((dayOfYear - 1) / 73); // 5 mois de 73 jours
        const dayOfMonth = ((dayOfYear - 1) % 73) + 1;
        const dayOfWeekIndex = (dayOfMonth - 1) % 5;
        return {
          month: monthIndex + 1,
          day: dayOfMonth,
          dayLabel: DAY_LABELS[dayOfWeekIndex],
          isX: false,
          year: cenozoicYear
        };
      } else {
        // Uniquement le jour bissextile (366e jour)
        return {
          month: '✖️',
          day: 1,
          dayLabel: `✖️`,
          isX: true,
          year: cenozoicYear
        };
      }
    }

    function updateClockAndHeader() {
      const now = new Date();
      
      const hrs = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const secs = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hrs}:${mins}:${secs}`;

      const fixed = convertToFixedDate(now);
      const dateString = fixed.isX
        ? `${formatYear(fixed.year)} / ✖️ / 1 ✖️`
        : `${formatYear(fixed.year)} / ${fixed.month} / ${fixed.day} ${fixed.dayLabel}`;
      
      document.getElementById('current-fixed-date').textContent = dateString;
    }

    function renderCalendar() {
      const grid = document.getElementById('calendar-grid');
      grid.innerHTML = '';
      
      const displayedCenozoicYear = getCenozoicYear(selectedGregorianYear);
      document.getElementById('displayed-year').textContent = formatYear(displayedCenozoicYear);

      const now = new Date();
      const fixedToday = convertToFixedDate(now);
      const leap = isLeapYear(selectedGregorianYear);

      // Render les 5 Mois de 73 jours
      for (let m = 1; m <= 5; m++) {
        const card = document.createElement('div');
        card.className = 'month-card';

        const title = document.createElement('div');
        title.className = 'month-title';
        title.textContent = `${m}`;
        card.appendChild(title);

        const header = document.createElement('div');
        header.className = 'days-header';
        DAY_LABELS.forEach(label => {
          const span = document.createElement('span');
          span.textContent = label;
          header.appendChild(span);
        });
        card.appendChild(header);

        const daysGrid = document.createElement('div');
        daysGrid.className = 'days-grid';

        for (let d = 1; d <= 73; d++) {
          const cell = document.createElement('div');
          cell.className = 'day-cell';
          cell.textContent = d;

          if (selectedGregorianYear === now.getFullYear() && !fixedToday.isX && fixedToday.month === m && fixedToday.day === d) {
            cell.classList.add('today');
          }
          daysGrid.appendChild(cell);
        }

        card.appendChild(daysGrid);
        grid.appendChild(card);
      }

      // Render le jour bissextile (uniquement si année bissextile)
      if (leap) {
        const cardX = document.createElement('div');
        cardX.className = 'month-card month-x';

        const titleX = document.createElement('div');
        titleX.className = 'month-title';
        titleX.textContent = `✖️`;
        cardX.appendChild(titleX);

        const daysGridX = document.createElement('div');
        daysGridX.className = 'days-grid';

        const cell = document.createElement('div');
        cell.className = 'day-cell';
        cell.textContent = `✖️1`;

        if (selectedGregorianYear === now.getFullYear() && fixedToday.isX) {
          cell.classList.add('today');
        }
        daysGridX.appendChild(cell);

        cardX.appendChild(daysGridX);
        grid.appendChild(cardX);
      }
    }

    // Toggle Affichage
    document.getElementById('hero-card').addEventListener('click', () => {
      document.getElementById('calendar-container').classList.toggle('visible');
    });

    // Navigation d'année
    document.getElementById('prev-year').addEventListener('click', () => {
      selectedGregorianYear--;
      renderCalendar();
    });

    document.getElementById('next-year').addEventListener('click', () => {
      selectedGregorianYear++;
      renderCalendar();
    });

    renderCalendar();
    updateClockAndHeader();
    setInterval(updateClockAndHeader, 1000);
  </script>
</body>
</html>
