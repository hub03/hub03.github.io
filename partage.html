<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ma note</title>
    <style>
      input {
        font-size: 18px;
        padding: 10px;
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <input id="principal" placeholder="Compte principal" />
    <input id="attached" placeholder="Compte rataché" />
    <input id="services" placeholder="Services" />
    <input type=checkbox id="used" placeholder="Utilisé ?" />

    <script>
      const inputs = document.querySelectorAll("input");

      inputs.forEach(function (input) {
        // 1. Au chargement : afficher ce qui est sauvegardé
        input.value = localStorage.getItem(input.id) || "";

        // 2. À chaque frappe : sauvegarder automatiquement
        input.addEventListener("input", function () {
          localStorage.setItem(input.id, input.value);
        });
      });
    </script>
  </body>
</html>
