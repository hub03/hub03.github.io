<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Priorités - Vue simplifiée</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 1rem;
      background: #f9f9f9;
    }

    h1 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    input[type="file"] {
      width: 100%;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      font-size: 0.85rem;
    }

    th, td {
      padding: 0.45rem;
      border: 1px solid #ddd;
      text-align: center;
      white-space: nowrap;
    }

    th {
      background: #efefef;
      font-weight: 600;
    }

    th:first-child,
    td:first-child {
      text-align: left;
      font-weight: 600;
      background: #fafafa;
    }

    /* Lignes spécifiques */
    .row-magasin {
      background: #f2f2f2;
    }

    .row-secteur {
      background: #e0e0e0;
    }

    /* Styles R */
    .r-ok {
      color: #1a7f37;
      font-weight: 700;
    }

    .r-bad {
      color: #c62828;
      font-weight: 700;
    }
  </style>
</head>
<body>

<h1>Tableau des priorités</h1>

<input type="file" id="fileInput" accept=".xlsx">

<table id="resultTable" style="display:none;">
  <thead>
    <tr>
      <th></th>
      <th>P1 Box VR</th>
      <th>P2 Abo</th>
      <th>P3 Assu</th>
      <th>P4 Access</th>
      <th>P5 Pro</th>
      <th>P6 MS</th>
      <th>C7 Mig</th>
      <th>C8 Canal+</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
  const fileInput = document.getElementById("fileInput");
  const table = document.getElementById("resultTable");
  const tbody = table.querySelector("tbody");

  /* =====================================================
     CONFIGURATION EXCEL – TU MODIFIES ICI
     R = Réalisé (déjà OK)
     O = Objectif (À ADAPTER)
     ===================================================== */

  const rows = [
    {
      label: "Antoine",
      cells: [
        { R: "AK10", O: "AL10" },
        { R: "BC10", O: "BD10" },
        { R: "BO10", O: "BP10" },
        { R: "BR10", O: "BS10" }, // P4 Access
        { R: "AW10", O: "AX10" },
        { R: "AZ10", O: "BA10" },
        { R: "AQ10", O: "AR10" },
        { R: "AT10", O: "AU10" }
      ]
    },
    {
      label: "Nicolas",
      cells: [
        { R: "AK11", O: "AL11" },
        { R: "BC11", O: "BD11" },
        { R: "BO11", O: "BP11" },
        { R: "BR11", O: "BS11" },
        { R: "AW11", O: "AX11" },
        { R: "AZ11", O: "BA11" },
        { R: "AQ11", O: "AR11" },
        { R: "AT11", O: "AU11" }
      ]
    },
    {
      label: "Rémy",
      cells: [
        { R: "AK12", O: "AL12" },
        { R: "BC12", O: "BD12" },
        { R: "BO12", O: "BP12" },
        { R: "BR12", O: "BS12" },
        { R: "AW12", O: "AX12" },
        { R: "AZ12", O: "BA12" },
        { R: "AQ12", O: "AR12" },
        { R: "AT12", O: "AU12" }
      ]
    },
    {
      label: "Magasin",
      rowClass: "row-magasin",
      cells: [
        { R: "AK15", O: "AL15" },
        { R: "BC15", O: "BD15" },
        { R: "BO15", O: "BP15" },
        { R: "BR15", O: "BS15" },
        { R: "AW15", O: "AX15" },
        { R: "AZ15", O: "BA15" },
        { R: "AQ15", O: "AR15" },
        { R: "AT15", O: "AU15" }
      ]
    },
    {
      label: "OU1",
      rowClass: "row-secteur",
      cells: [
        { R: "AK16", O: "AL16" },
        { R: "BC16", O: "BD16" },
        { R: "BO16", O: "BP16" },
        { R: "BR16", O: "BS16" },
        { R: "AW16", O: "AX16" },
        { R: "AZ16", O: "BA16" },
        { R: "AQ16", O: "AR16" },
        { R: "AT16", O: "AU16" }
      ]
    }
  ];

  /* ===================================================== */

  fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = (evt) => {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: "array" });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];

      tbody.innerHTML = "";

      rows.forEach(row => {
        const tr = document.createElement("tr");
        if (row.rowClass) tr.classList.add(row.rowClass);

        tr.innerHTML = `<td>${row.label}</td>`;

        row.cells.forEach((cell, index) => {
          let r = sheet[cell.R]?.v ?? "";
          let o = sheet[cell.O]?.v ?? "";

          // P4 Access → arrondi à l'entier supérieur (index 3)
          if (index === 3 && typeof r === "number") {
            r = Math.ceil(r);
          }

          let rClass = "";
          if (typeof r === "number" && typeof o === "number") {
            rClass = r >= o ? "r-ok" : "r-bad";
          }

          tr.innerHTML += `
            <td>
              <span class="${rClass}">${r}</span> / ${o}
            </td>
          `;
        });

        tbody.appendChild(tr);
      });

      table.style.display = "table";
    };

    reader.readAsArrayBuffer(file);
  });
</script>

</body>
</html>
