<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Priorités - Vue simplifiée</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 1rem;
      background: #f9f9f9;
    }

    h1 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    input[type="file"] {
      width: 100%;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      font-size: 0.85rem;
    }

    th, td {
      padding: 0.45rem;
      border: 1px solid #ddd;
      text-align: center;
      white-space: nowrap;
    }

    th {
      background: #efefef;
      font-weight: 600;
    }

    th:first-child,
    td:first-child {
      text-align: left;
      font-weight: 600;
      background: #fafafa;
    }

    .row-magasin {
      background: #f2f2f2;
    }

    .row-secteur {
      background: #e0e0e0;
    }

    .r-ok {
      color: #1a7f37;
      font-weight: 700;
    }

    .r-bad {
      color: #c62828;
      font-weight: 700;
    }
  </style>
</head>
<body>

<h1>Tableau des priorités</h1>

<input type="file" id="fileInput" accept=".xlsx">

<table id="resultTable" style="display:none;">
  <thead>
    <tr>
      <th></th>
      <th>P1 Box VR</th>
      <th>P2 Abo</th>
      <th>P3 Assu</th>
      <th>P4 Access</th>
      <th>P5 Pro</th>
      <th>P6 MS</th>
      <th>C7 Mig</th>
      <th>C8 Canal+</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
  const fileInput = document.getElementById("fileInput");
  const table = document.getElementById("resultTable");
  const tbody = table.querySelector("tbody");

  /* =====================================================
     CONFIGURATION EXCEL
     R = Réalisé
     O = Objectif
     ⚠️ Toutes les cellules ont été décalées d’1 colonne à gauche
     ===================================================== */

  const rows = [
    {
      label: "Antoine",
      cells: [
        { R: "AJ10", O: "AK10" },
        { R: "BB10", O: "BC10" },
        { R: "BN10", O: "BO10" },
        { R: "BQ10", O: "BR10" }, // P4 Access
        { R: "AV10", O: "AW10" },
        { R: "AY10", O: "AZ10" },
        { R: "AP10", O: "AQ10" },
        { R: "AS10", O: "AT10" }
      ]
    },
    {
      label: "Nicolas",
      cells: [
        { R: "AJ11", O: "AK11" },
        { R: "BB11", O: "BC11" },
        { R: "BN11", O: "BO11" },
        { R: "BQ11", O: "BR11" },
        { R: "AV11", O: "AW11" },
        { R: "AY11", O: "AZ11" },
        { R: "AP11", O: "AQ11" },
        { R: "AS11", O: "AT11" }
      ]
    },
    {
      label: "Rémy",
      cells: [
        { R: "AJ12", O: "AK12" },
        { R: "BB12", O: "BC12" },
        { R: "BN12", O: "BO12" },
        { R: "BQ12", O: "BR12" },
        { R: "AV12", O: "AW12" },
        { R: "AY12", O: "AZ12" },
        { R: "AP12", O: "AQ12" },
        { R: "AS12", O: "AT12" }
      ]
    },
    {
      label: "Magasin",
      rowClass: "row-magasin",
      cells: [
        { R: "AJ15", O: "AK15" },
        { R: "BB15", O: "BC15" },
        { R: "BN15", O: "BO15" },
        { R: "BQ15", O: "BR15" },
        { R: "AV15", O: "AW15" },
        { R: "AY15", O: "AZ15" },
        { R: "AP15", O: "AQ15" },
        { R: "AS15", O: "AT15" }
      ]
    },
    {
      label: "OU1",
      rowClass: "row-secteur",
      cells: [
        { R: "AJ16", O: "AK16" },
        { R: "BB16", O: "BC16" },
        { R: "BN16", O: "BO16" },
        { R: "BQ16", O: "BR16" },
        { R: "AV16", O: "AW16" },
        { R: "AY16", O: "AZ16" },
        { R: "AP16", O: "AQ16" },
        { R: "AS16", O: "AT16" }
      ]
    }
  ];

  /* ===================================================== */

  fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = (evt) => {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: "array" });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];

      tbody.innerHTML = "";

      rows.forEach(row => {
        const tr = document.createElement("tr");
        if (row.rowClass) tr.classList.add(row.rowClass);

        tr.innerHTML = `<td>${row.label}</td>`;

        row.cells.forEach((cell, index) => {
          let r = sheet[cell.R]?.v ?? "";
          let o = sheet[cell.O]?.v ?? "";

          // P4 Access : arrondi du R à l'entier supérieur
          if (index === 3 && typeof r === "number") {
            r = Math.ceil(r);
          }

          // Couleur du R selon comparaison R / O
          let rClass = "";
          if (typeof r === "number" && typeof o === "number") {
            rClass = r >= o ? "r-ok" : "r-bad";
          }

          tr.innerHTML += `
            <td>
              <span class="${rClass}">${r}</span> / ${o}
            </td>
          `;
        });

        tbody.appendChild(tr);
      });

      table.style.display = "table";
    };

    reader.readAsArrayBuffer(file);
  });
</script>

</body>
</html>
