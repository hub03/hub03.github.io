<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Priorités - Vue simplifiée</title>

  <!-- Librairie pour lire les fichiers Excel (.xlsx) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 1rem;
      background: #f9f9f9;
    }

    h1 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    input[type="file"] {
      width: 100%;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      font-size: 0.85rem;
    }

    th, td {
      padding: 0.45rem;
      border: 1px solid #ddd;
      text-align: center;
      white-space: nowrap;
    }

    th {
      background: #efefef;
      font-weight: 600;
    }

    /* Première colonne : libellés (vendeurs, magasin, secteur) */
    th:first-child,
    td:first-child {
      text-align: left;
      font-weight: 600;
      background: #fafafa;
    }
  </style>
</head>
<body>

<h1>Tableau des priorités</h1>

<input type="file" id="fileInput" accept=".xlsx">

<table id="resultTable" style="display:none;">
  <thead>
    <tr>
      <th></th>
      <th>P1 Box VR</th>
      <th>P2 Abo</th>
      <th>P3 Assu</th>
      <th>P4 Access</th>
      <th>P5 Pro</th>
      <th>P6 MS</th>
      <th>C7 Mig</th>
      <th>C8 Canal+</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
  const fileInput = document.getElementById("fileInput");
  const table = document.getElementById("resultTable");
  const tbody = table.querySelector("tbody");

  /* =====================================================
     CONFIGURATION EXCEL – C’EST ICI QUE TU MODIFIES
     ===================================================== */

  /*
    Chaque entrée du tableau "rows" correspond à UNE LIGNE
    dans le tableau final (vendeur, magasin ou secteur)

    label  → texte affiché dans la première colonne
    cells  → cellules Excel correspondant à P1 → P8
  */

  const rows = [
    // ---------- VENDEUR 1 ----------
    {
      label: "Antoine",
      cells: ["AK10", "BC10", "BO10", "BR10", "AW10", "AZ10", "AQ10", "AT10"]
    },

    // ---------- VENDEUR 2 ----------
    {
      label: "Nicolas",
      cells: ["AK11", "BC11", "BO11", "BR11", "AW11", "AZ11", "AQ11", "AT11"]
    },

    // ---------- VENDEUR 3 ----------
    {
      label: "Rémy",
      cells: ["AK12", "BC12", "BO12", "BR12", "AW12", "AZ12", "AQ12", "AT12"]
    },

    // ---------- MAGASIN ----------
    {
      label: "Magasin",
      cells: ["AK15", "BC15", "BO15", "BR15", "AW15", "AZ15", "AQ15", "AT15"]
    },

    // ---------- SECTEUR ----------
    {
      label: "OU1",
      cells: ["AK16", "BC16", "BO16", "BR16", "AW16", "AZ16", "AQ16", "AT16"]
    }
  ];

  /* ===================================================== */

  fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = (evt) => {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: "array" });

      // 👉 Par défaut on lit la première feuille
      const sheet = workbook.Sheets[workbook.SheetNames[0]];

      tbody.innerHTML = "";

      rows.forEach(rowConfig => {
        const tr = document.createElement("tr");

        // Colonne libellé
        tr.innerHTML = `<td>${rowConfig.label}</td>`;

        // Colonnes P1 → P8
        rowConfig.cells.forEach(cellRef => {
          const cell = sheet[cellRef];
          const value = cell ? cell.v : "";
          tr.innerHTML += `<td>${value}</td>`;
        });

        tbody.appendChild(tr);
      });

      table.style.display = "table";
    };

    reader.readAsArrayBuffer(file);
  });
</script>

</body>
</html>
