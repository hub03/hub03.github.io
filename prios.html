<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Priorités - Vue simplifiée</title>

  <!-- Librairie pour lire les fichiers Excel (.xlsx) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 1rem;
      background: #f9f9f9;
    }

    h1 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    input[type="file"] {
      width: 100%;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      font-size: 0.85rem;
    }

    th, td {
      padding: 0.45rem;
      border: 1px solid #ddd;
      text-align: center;
      white-space: nowrap;
    }

    th {
      background: #efefef;
      font-weight: 600;
    }

    th:first-child,
    td:first-child {
      text-align: left;
      font-weight: 600;
      background: #fafafa;
    }

    /* Lignes spécifiques */
    .row-magasin {
      background: #f2f2f2;
    }

    .row-secteur {
      background: #e0e0e0;
    }

    /* Styles pour la valeur R */
    .r-ok {
      color: #1a7f37;
      font-weight: 700;
    }

    .r-bad {
      color: #c62828;
      font-weight: 700;
    }
  </style>
</head>
<body>

<h1>Tableau des priorités</h1>

<input type="file" id="fileInput" accept=".xlsx">

<table id="resultTable" style="display:none;">
  <thead>
    <tr>
      <th></th>
      <th>P1 Box VR</th>
      <th>P2 Abo</th>
      <th>P3 Assu</th>
      <th>P4 Access</th>
      <th>P5 Pro</th>
      <th>P6 MS</th>
      <th>C7 Mig</th>
      <th>C8 Canal+</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
  const fileInput = document.getElementById("fileInput");
  const table = document.getElementById("resultTable");
  const tbody = table.querySelector("tbody");

  /* =====================================================
     CONFIGURATION EXCEL
     R = Réalisé
     P = % R/O (texte : +66,7% ou -20%)
     ===================================================== */

  const rows = [
    {
      label: "Antoine",
      cells: [
        { R: "AK10", P: "AL10" },
        { R: "BC10", P: "BE10" },
        { R: "BO10", P: "BP10" },
        { R: "BR10", P: "BS10" }, // P4 Access
        { R: "AW10", P: "AX10" },
        { R: "AZ10", P: "BA10" },
        { R: "AQ10", P: "AR10" },
        { R: "AT10", P: "AU10" }
      ]
    },
    {
      label: "Nicolas",
      cells: [
        { R: "AK11", P: "AL11" },
        { R: "BC11", P: "BD11" },
        { R: "BO11", P: "BP11" },
        { R: "BR11", P: "BS11" },
        { R: "AW11", P: "AX11" },
        { R: "AZ11", P: "BA11" },
        { R: "AQ11", P: "AR11" },
        { R: "AT11", P: "AU11" }
      ]
    },
    {
      label: "Rémy",
      cells: [
        { R: "AK12", P: "AL12" },
        { R: "BC12", P: "BD12" },
        { R: "BO12", P: "BP12" },
        { R: "BR12", P: "BS12" },
        { R: "AW12", P: "AX12" },
        { R: "AZ12", P: "BA12" },
        { R: "AQ12", P: "AR12" },
        { R: "AT12", P: "AU12" }
      ]
    },
    {
      label: "Magasin",
      rowClass: "row-magasin",
      cells: [
        { R: "AK15", P: "AL15" },
        { R: "BC15", P: "BD15" },
        { R: "BO15", P: "BP15" },
        { R: "BR15", P: "BS15" },
        { R: "AW15", P: "AX15" },
        { R: "AZ15", P: "BA15" },
        { R: "AQ15", P: "AR15" },
        { R: "AT15", P: "AU15" }
      ]
    },
    {
      label: "OU1",
      rowClass: "row-secteur",
      cells: [
        { R: "AK16", P: "AL16" },
        { R: "BC16", P: "BD16" },
        { R: "BO16", P: "BP16" },
        { R: "BR16", P: "BS16" },
        { R: "AW16", P: "AX16" },
        { R: "AZ16", P: "BA16" },
        { R: "AQ16", P: "AR16" },
        { R: "AT16", P: "AU16" }
      ]
    }
  ];

  /* ===================================================== */

  function parsePercent(text) {
    if (!text) return null;

    // "+66,7%" -> 0.667
    const clean = text
      .replace("%", "")
      .replace(",", ".")
      .trim();

    const value = parseFloat(clean);
    return isNaN(value) ? null : value / 100;
  }

  fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = (evt) => {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: "array" });
      const sheet = workbook.Sheets[workbook.SheetNames[0]];

      tbody.innerHTML = "";

      rows.forEach(row => {
        const tr = document.createElement("tr");
        if (row.rowClass) tr.classList.add(row.rowClass);

        // Libellé (vendeur / magasin / secteur)
        tr.innerHTML = `<td>${row.label}</td>`;

        row.cells.forEach((cell, index) => {
          let r = sheet[cell.R]?.v ?? "";
          const percentText = sheet[cell.P]?.v ?? "";

          const percent = parsePercent(percentText);

          let o = "";
          if (typeof r === "number" && percent !== null) {
            const factor = 1 + percent;
            if (factor !== 0) {
              o = Math.round(r / factor);
            }
          }

          // P4 Access : arrondi à l'entier supérieur
          if (index === 3 && typeof r === "number") {
            r = Math.ceil(r);
          }

          // Couleur du R selon le signe du %
          let rClass = "";
          if (typeof percentText === "string") {
            if (percentText.trim().startsWith("+")) rClass = "r-ok";
            if (percentText.trim().startsWith("-")) rClass = "r-bad";
          }

          tr.innerHTML += `
            <td>
              <span class="${rClass}">${r}</span> / ${o}
            </td>
          `;
        });

        tbody.appendChild(tr);
      });

      table.style.display = "table";
    };

    reader.readAsArrayBuffer(file);
  });
</script>

</body>
</html>
