<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Priorités - Vue simplifiée</title>

  <!-- Librairie pour lire les fichiers Excel (.xlsx) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 1rem;
      background: #f9f9f9;
    }

    h1 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    input[type="file"] {
      width: 100%;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      font-size: 0.85rem;
    }

    th, td {
      padding: 0.45rem;
      border: 1px solid #ddd;
      text-align: center;
      white-space: nowrap;
    }

    th {
      background: #efefef;
      font-weight: 600;
    }

    /* Première colonne : libellés (vendeurs, magasin, secteur) */
    th:first-child,
    td:first-child {
      text-align: left;
      font-weight: 600;
      background: #fafafa;
    }
  </style>
</head>
<body>

<h1>Tableau des priorités</h1>

<input type="file" id="fileInput" accept=".xlsx">

<table id="resultTable" style="display:none;">
  <thead>
    <tr>
      <th></th>
      <th>P1</th>
      <th>P2</th>
      <th>P3</th>
      <th>P4</th>
      <th>P5</th>
      <th>P6</th>
      <th>P7</th>
      <th>P8</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
  const fileInput = document.getElementById("fileInput");
  const table = document.getElementById("resultTable");
  const tbody = table.querySelector("tbody");

  /* =====================================================
     CONFIGURATION EXCEL – C’EST ICI QUE TU MODIFIES
     ===================================================== */

  /*
    Chaque entrée du tableau "rows" correspond à UNE LIGNE
    dans le tableau final (vendeur, magasin ou secteur)

    label  → texte affiché dans la première colonne
    cells  → cellules Excel correspondant à P1 → P8
  */

  const rows = [
    // ---------- VENDEUR 1 ----------
    {
      label: "Vendeur 1",
      cells: ["C2", "D2", "E2", "F2", "G2", "H2", "I2", "J2"]
    },

    // ---------- VENDEUR 2 ----------
    {
      label: "Vendeur 2",
      cells: ["C3", "D3", "E3", "F3", "G3", "H3", "I3", "J3"]
    },

    // ---------- VENDEUR 3 ----------
    {
      label: "Vendeur 3",
      cells: ["C4", "D4", "E4", "F4", "G4", "H4", "I4", "J4"]
    },

    // ---------- VENDEUR 4 ----------
    {
      label: "Vendeur 4",
      cells: ["C5", "D5", "E5", "F5", "G5", "H5", "I5", "J5"]
    },

    // ---------- VENDEUR 5 ----------
    {
      label: "Vendeur 5",
      cells: ["C6", "D6", "E6", "F6", "G6", "H6", "I6", "J6"]
    },

    // ---------- MAGASIN ----------
    {
      label: "Magasin",
      cells: ["C8", "D8", "E8", "F8", "G8", "H8", "I8", "J8"]
    },

    // ---------- SECTEUR ----------
    {
      label: "Secteur",
      cells: ["C9", "D9", "E9", "F9", "G9", "H9", "I9", "J9"]
    }
  ];

  /* ===================================================== */

  fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = (evt) => {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, { type: "array" });

      // 👉 Par défaut on lit la première feuille
      const sheet = workbook.Sheets[workbook.SheetNames[0]];

      tbody.innerHTML = "";

      rows.forEach(rowConfig => {
        const tr = document.createElement("tr");

        // Colonne libellé
        tr.innerHTML = `<td>${rowConfig.label}</td>`;

        // Colonnes P1 → P8
        rowConfig.cells.forEach(cellRef => {
          const cell = sheet[cellRef];
          const value = cell ? cell.v : "";
          tr.innerHTML += `<td>${value}</td>`;
        });

        tbody.appendChild(tr);
      });

      table.style.display = "table";
    };

    reader.readAsArrayBuffer(file);
  });
</script>

</body>
</html>
