<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Priorités - Vue simplifiée</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 1rem;
      background: #f9f9f9;
    }

    h1 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    input[type="file"] {
      width: 100%;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      font-size: 0.85rem;
      border: 2px solid black;
    }

    th, td {
      padding: 0.45rem;
      border: 1px solid #ddd;
      text-align: center;
      white-space: nowrap;
    }

    /* Bordures spécifiques */
    th:nth-child(1), td:nth-child(1),
th:nth-child(8), td:nth-child(8),
th:nth-child(9), td:nth-child(9) {
  border-right: 2px solid black;
}

    th {
      background: #efefef;
      font-weight: 600;
    }

    th:first-child,
    td:first-child {
      text-align: left;
      font-weight: 600;
      background: #fafafa;
    }

    #dateCell {
      color: #1565c0;
      font-weight: 700;
    }

    .row-magasin { background: #f2f2f2; }
    .row-secteur { background: #e0e0e0; }

    .r-ok { color: #00c853; font-weight: 700; }
    .r-bad { color: #ff1744; font-weight: 700; }

    #shareBtn {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      font-size: 1.2rem;
      background: none;
      border: 1px solid #ccc;
      cursor: pointer;
      display: none;
    }

    #shareBtn:hover {
      background: #f0f0f0;
    }
  </style>
</head>
<body>

<h1>Tableau des priorités</h1>

<input type="file" id="fileInput" accept=".xlsx">

<table id="resultTable" style="display:none;">
  <thead>
    <tr>
      <th id="dateCell"></th>
      <th>Box VV</th>
      <th>P1 Box VR</th>
      <th>P2 Abo</th>
      <th>P3 Assu</th>
      <th>P4 Access</th>
      <th>P5 Optima</th>
      <th>C6 Canal+</th>
      <th>Score</th>
      <th>Tx d'assu</th>
      <th>Tx 5Go et +</th>
      <th>Tx reprise</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<button id="shareBtn">📤</button>

<script>
const fileInput = document.getElementById("fileInput");
const table = document.getElementById("resultTable");
const tbody = table.querySelector("tbody");
const shareBtn = document.getElementById("shareBtn");

const rows = [
{
label:"Antoine",
cells:[{R:"E10",O:"F10"},{R:"AG10",O:"AH10"},{R:"BB10",O:"BC10"},{R:"BN10",O:"BO10"},{R:"BQ10",O:"BR10"},{R:"AP10",O:"AQ10"},{R:"AS10",O:"AT10"}],
taux:{assu:"DC10",go5:"CO10",reprise:"CW10"}
},
{
label:"Nicolas",
cells:[{R:"E11",O:"F11"},{R:"AG11",O:"AH11"},{R:"BB11",O:"BC11"},{R:"BN11",O:"BO11"},{R:"BQ11",O:"BR11"},{R:"AP11",O:"AQ11"},{R:"AS11",O:"AT11"}],
taux:{assu:"DC11",go5:"CO11",reprise:"CW11"}
},
{
label:"Rémy",
cells:[{R:"E12",O:"F12"},{R:"AG12",O:"AH12"},{R:"BB12",O:"BC12"},{R:"BN12",O:"BO12"},{R:"BQ12",O:"BR12"},{R:"AP12",O:"AQ12"},{R:"AS12",O:"AT12"}],
taux:{assu:"DC12",go5:"CO12",reprise:"CW12"}
},
{
label:"Maëlys",
cells:[{R:"E13",O:"F13"},{R:"AG13",O:"AH13"},{R:"BB13",O:"BC13"},{R:"BN13",O:"BO13"},{R:"BQ13",O:"BR13"},{R:"AP13",O:"AQ13"},{R:"AS13",O:"AT13"}],
taux:{assu:"DC13",go5:"CO13",reprise:"CW13"}
},
{
label:"Mylène",
cells:[{R:"E15",O:"F15"},{R:"AG15",O:"AH15"},{R:"BB15",O:"BC15"},{R:"BN15",O:"BO15"},{R:"BQ15",O:"BR15"},{R:"AP15",O:"AQ15"},{R:"AS15",O:"AT15"}],
taux:{assu:"DC15",go5:"CO15",reprise:"CW15"}
},
{
label:"Magasin",
rowClass:"row-magasin",
cells:[{R:"E16",O:"F16"},{R:"AG16",O:"AH16"},{R:"BB16",O:"BC16"},{R:"BN16",O:"BO16"},{R:"BQ16",O:"BR16"},{R:"AP16",O:"AQ16"},{R:"AS16",O:"AT16"}],
taux:{assu:"DC16",go5:"CO16",reprise:"CW16"}
},
{
label:"OU1",
rowClass:"row-secteur",
cells:[{R:"E17",O:"F17"},{R:"AG17",O:"AH17"},{R:"BB17",O:"BC17"},{R:"BN17",O:"BO17"},{R:"BQ17",O:"BR17"},{R:"AP17",O:"AQ17"},{R:"AS17",O:"AT17"}],
taux:{assu:"DC17",go5:"CO17",reprise:"CW17"}
}
];

fileInput.addEventListener("change",(e)=>{
const file=e.target.files[0];
if(!file)return;

fileInput.style.display="none";

const today=new Date();
const formatted=("0"+today.getDate()).slice(-2)+"/"+("0"+(today.getMonth()+1)).slice(-2);
document.getElementById("dateCell").textContent=formatted;

const reader=new FileReader();

reader.onload=(evt)=>{
const data=new Uint8Array(evt.target.result);
const workbook=XLSX.read(data,{type:"array"});
const sheet=workbook.Sheets[workbook.SheetNames[0]];

tbody.innerHTML="";

rows.forEach(row=>{
const tr=document.createElement("tr");
if(row.rowClass)tr.classList.add(row.rowClass);

tr.innerHTML=`<td>${row.label}</td>`;
let score=0;

row.cells.forEach((cell,index)=>{
let r=sheet[cell.R]?.v??"";
let o=sheet[cell.O]?.v??"";

if(index===4 && typeof r==="number"){
  r = Math.ceil(r);
}

if(typeof o==="number"){
  o = Math.ceil(o);
}

let rClass="";
if(typeof r==="number"&&typeof o==="number"){
const ok=r>=o;
rClass=ok?"r-ok":"r-bad";

if (ok && index > 0) {
  score += (index === 1 || index === 2 || index === 3 || index === 4) ? 2 : 1;
}
}

tr.innerHTML+=`<td><span class="${rClass}">${r}</span> / ${o}</td>`;
});

tr.innerHTML+=`<td>${score} / 10</td>`;

const formatPercent=v=>typeof v==="number"?(v*100).toFixed(1)+"%":v;

tr.innerHTML+=`<td>${formatPercent(sheet[row.taux.assu]?.v??"")}</td>`;
tr.innerHTML+=`<td>${formatPercent(sheet[row.taux.go5]?.v??"")}</td>`;
tr.innerHTML+=`<td>${formatPercent(sheet[row.taux.reprise]?.v??"")}</td>`;

tbody.appendChild(tr);
});

table.style.display="table";
shareBtn.style.display="inline-block";
};

reader.readAsArrayBuffer(file);
});

/* ===== COPIE IMAGE DANS PRESSE PAPIER ===== */
shareBtn.addEventListener("click",async()=>{
const canvas=await html2canvas(table,{scale:2});
canvas.toBlob(async(blob)=>{
const item=new ClipboardItem({"image/png":blob});
await navigator.clipboard.write([item]);
alert("Image copiée ✅\nCollez-la directement dans WhatsApp.");
});
});
</script>

</body>
</html>
