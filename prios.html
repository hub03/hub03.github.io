<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Priorités - Vue simplifiée</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 1rem;
      background: #f9f9f9;
    }

    h1 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    input[type="file"] {
      width: 100%;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      font-size: 0.85rem;
      border: 2px solid black;
    }

    th, td {
      padding: 0.45rem;
      border: 1px solid #ddd;
      text-align: center;
      white-space: nowrap;
    }

    /* Bordures spécifiques */
    th:nth-child(1), td:nth-child(1),
    th:nth-child(9), td:nth-child(9),
    th:nth-child(10), td:nth-child(10) {
      border-right: 2px solid black;
    }

    th {
      background: #efefef;
      font-weight: 600;
    }

    th:first-child,
    td:first-child {
      text-align: left;
      font-weight: 600;
      background: #fafafa;
    }

    #dateCell {
      color: #1565c0;
      font-weight: 700;
    }

    .row-magasin { background: #f2f2f2; }
    .row-secteur { background: #e0e0e0; }

    .r-ok { color: #00c853; font-weight: 700; }
    .r-bad { color: #ff1744; font-weight: 700; }

    #shareBtn {
      margin-top: 1rem;
      padding: 0.5rem 1rem;
      font-size: 1.2rem;
      background: none;
      border: 1px solid #ccc;
      cursor: pointer;
      display: none;
    }

    #shareBtn:hover {
      background: #f0f0f0;
    }
  </style>
</head>
<body>

<h1>Tableau des priorités</h1>

<input type="file" id="fileInput" accept=".xlsx">

<table id="resultTable" style="display:none;">
  <thead>
    <tr>
      <th id="dateCell"></th>
      <th>Box VV</th>
      <th>P1 Box VR</th>
      <th>P2 Abo</th>
      <th>P3 Assu</th>
      <th>P4 Access</th>
      <th>P5 Pro</th>
      <th>P6 Optima</th>
      <th>C7 Mig</th>
      <th>C8 Canal+</th>
      <th>Score</th>
      <th>Tx d'assu</th>
      <th>Tx 5Go et +</th>
      <th>Tx reprise</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<button id="shareBtn">📤</button>

<script>
const fileInput = document.getElementById("fileInput");
const table = document.getElementById("resultTable");
const tbody = table.querySelector("tbody");
const shareBtn = document.getElementById("shareBtn");

const rows = [
{
label:"Antoine",
cells:[{R:"E10",O:"F10"},{R:"AJ10",O:"AK10"},{R:"BE10",O:"BF10"},{R:"BQ10",O:"BR10"},{R:"BT10",O:"BU10"},{R:"AY10",O:"AZ10"},{R:"AS10",O:"AT10"},{R:"AP10",O:"AQ10"},{R:"AV10",O:"AW10"}],
taux:{assu:"DF10",go5:"CR10",reprise:"CZ10"}
},
{
label:"Nicolas",
cells:[{R:"E11",O:"F11"},{R:"AJ11",O:"AK11"},{R:"BE11",O:"BF11"},{R:"BQ11",O:"BR11"},{R:"BT11",O:"BU11"},{R:"AY11",O:"AZ11"},{R:"AS11",O:"AT11"},{R:"AP11",O:"AQ11"},{R:"AV11",O:"AW11"}],
taux:{assu:"DF11",go5:"CR11",reprise:"CZ11"}
},
{
label:"Rémy",
cells:[{R:"E12",O:"F12"},{R:"AJ12",O:"AK12"},{R:"BE12",O:"BF12"},{R:"BQ12",O:"BR12"},{R:"BT12",O:"BU12"},{R:"AY12",O:"AZ12"},{R:"AS12",O:"AT12"},{R:"AP12",O:"AQ12"},{R:"AV12",O:"AW12"}],
taux:{assu:"DF12",go5:"CR12",reprise:"CZ12"}
},
{
label:"Magasin",
rowClass:"row-magasin",
cells:[{R:"E15",O:"F15"},{R:"AJ15",O:"AK15"},{R:"BE15",O:"BF15"},{R:"BQ15",O:"BR15"},{R:"BT15",O:"BU15"},{R:"AY15",O:"AZ15"},{R:"AS15",O:"AT15"},{R:"AP15",O:"AQ15"},{R:"AV15",O:"AW15"}],
taux:{assu:"DF15",go5:"CR15",reprise:"CZ15"}
},
{
label:"OU1",
rowClass:"row-secteur",
cells:[{R:"E16",O:"F16"},{R:"AJ16",O:"AK16"},{R:"BE16",O:"BF16"},{R:"BQ16",O:"BR16"},{R:"BQ16",O:"BR16"},{R:"AY16",O:"AZ16"},{R:"AS16",O:"AT16"},{R:"AP16",O:"AQ16"},{R:"AV16",O:"AW16"}],
taux:{assu:"DF16",go5:"CR16",reprise:"CZ16"}
}
];

fileInput.addEventListener("change",(e)=>{
const file=e.target.files[0];
if(!file)return;

fileInput.style.display="none";

const today=new Date();
const formatted=("0"+today.getDate()).slice(-2)+"/"+("0"+(today.getMonth()+1)).slice(-2);
document.getElementById("dateCell").textContent=formatted;

const reader=new FileReader();

reader.onload=(evt)=>{
const data=new Uint8Array(evt.target.result);
const workbook=XLSX.read(data,{type:"array"});
const sheet=workbook.Sheets[workbook.SheetNames[0]];

tbody.innerHTML="";

rows.forEach(row=>{
const tr=document.createElement("tr");
if(row.rowClass)tr.classList.add(row.rowClass);

tr.innerHTML=`<td>${row.label}</td>`;
let score=0;

row.cells.forEach((cell,index)=>{
let r=sheet[cell.R]?.v??"";
let o=sheet[cell.O]?.v??"";

if(index===3&&typeof r==="number")r=Math.ceil(r);
if(typeof o==="number")o=Math.ceil(o);

let rClass="";
if(typeof r==="number"&&typeof o==="number"){
const ok=r>=o;
rClass=ok?"r-ok":"r-bad";

if (ok && index > 0) {
  score += (index === 5 || index === 8) ? 2 : 1;
}
}

tr.innerHTML+=`<td><span class="${rClass}">${r}</span> / ${o}</td>`;
});

tr.innerHTML+=`<td>${score} / 10</td>`;

const formatPercent=v=>typeof v==="number"?(v*100).toFixed(1)+"%":v;

tr.innerHTML+=`<td>${formatPercent(sheet[row.taux.assu]?.v??"")}</td>`;
tr.innerHTML+=`<td>${formatPercent(sheet[row.taux.go5]?.v??"")}</td>`;
tr.innerHTML+=`<td>${formatPercent(sheet[row.taux.reprise]?.v??"")}</td>`;

tbody.appendChild(tr);
});

table.style.display="table";
shareBtn.style.display="inline-block";
};

reader.readAsArrayBuffer(file);
});

/* ===== COPIE IMAGE DANS PRESSE PAPIER ===== */
shareBtn.addEventListener("click",async()=>{
const canvas=await html2canvas(table,{scale:2});
canvas.toBlob(async(blob)=>{
const item=new ClipboardItem({"image/png":blob});
await navigator.clipboard.write([item]);
alert("Image copiée ✅\nCollez-la directement dans WhatsApp.");
});
});
</script>

</body>
</html>
