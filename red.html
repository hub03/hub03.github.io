<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Générateur de lien</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 12px;
      max-width: 480px;
      margin: auto;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 14px;
    }

    select, input {
      width: 100%;
      padding: 8px;
      font-size: 16px;
      margin-top: 4px;
    }

    #finalLink {
      display: block;
      margin-top: 16px;
      padding: 10px;
      background: #f3f3f3;
      border-radius: 6px;
      font-size: 13px;
      word-break: break-all;
      text-decoration: none;
      color: #000;
    }

    #lineSettings {
      margin-top: 8px;
      padding: 8px;
      background: #f8f8f8;
      border-radius: 4px;
      display: none;
    }

    #lineSettings label {
      display: inline;
      margin-right: 8px;
      margin-top: 0;
    }

    #lineAmount {
      width: 60px;
      display: inline;
      padding: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<form id="proxyForm"
  action="https://www.red-by-sfr.fr/mon-espace-client/parrainage-proxy.html"
  method="get">

  <!-- LIGNE -->
  <label>
    Ligne
    <select name="line" id="line">
      <option value="">-- choisir --</option>

      <option value="0250109832" data-env="FIXE" data-parrain="REDE6139B3">O250109832 – Charlie</option>
      <option value="0688155362" data-env="MOBILE" data-parrain="Aucun">O688155362 – Charlie</option>
      <option value="0603875924" data-env="MOBILE" data-parrain="RED43FE30A">O603875924 – Eric</option>
      <option value="0616121253" data-env="MOBILE" data-parrain="REDB0E2EE8">O616121253 – Eric</option>
      <option value="0982336075" data-env="FIXE" data-parrain="REDF62DE61">O982336075 – Geoffrey</option>
      <option value="0761589821" data-env="MOBILE" data-parrain="REDAE53B4A">O761589821 – Geoffrey</option>
      <option value="0601851791" data-env="MOBILE" data-parrain="RED25AF700">O601851791 – Greedy F</option>
      <option value="0603306030" data-env="MOBILE" data-parrain="RED6750F0C">O603306030 – GreedYo</option>
      <option value="0612990848" data-env="MOBILE" data-parrain="REDD650D19">O612990848 – Jean-François</option>
      <option value="0768317051" data-env="MOBILE" data-parrain="RED7AAEF8E">O768317051 – Jeannine</option>
      <option value="0616511145" data-env="MOBILE" data-parrain="RED5C4A5D2">O616511145 – Lambert</option>
      <option value="0214402122" data-env="FIXE" data-parrain="RED9A6AFC2">O214402122 – Lambert</option>
      <option value="0634223543" data-env="MOBILE" data-parrain="REDA3918FB">O634223543 – Lambert</option>
      <option value="0646609398" data-env="MOBILE" data-parrain="RED43B2F41">O646609398 – Laurent</option>
      <option value="0787759080" data-env="MOBILE" data-parrain="RED15A801D">O787759080 – Léana</option>
      
      <option value="0777834537" data-env="MOBILE" data-parrain="Aucun">O777834537 – Loïc</option>
      <option value="0626625355" data-env="MOBILE" data-parrain="Aucun">O626625355 – Loïc</option>
      <option value="0623618242" data-env="MOBILE" data-parrain="Aucun">O623618242 – Loïc</option>
      <option value="0614581108" data-env="MOBILE" data-parrain="Aucun">O614581108 – Loïc</option>
      <option value="0629341379" data-env="MOBILE" data-parrain="Aucun">O629341379 – Loïc</option>

      <option value="0977718198" data-env="FIXE" data-parrain="RED2B8D9C3">O977718198 – Olivier</option>
      <option value="0674581949" data-env="MOBILE" data-parrain="RED6322AFF">O674581949 – Olivier</option>
      <option value="0231081987" data-env="FIXE" data-parrain="RED4F86B0C">O231081987 – Sylvie</option>
      <option value="0679813382" data-env="MOBILE" data-parrain="RED8DE1CB9">O679813382 – Sylvie</option>
      <option value="0614713247" data-env="MOBILE" data-parrain="REDA1D0F28">O614713247 – YFLM</option>
    </select>
  </label>

  <!-- Paramètres de cagnotte pour la ligne sélectionnée -->
  <div id="lineSettings">
    <label>
      Validé : <input type="checkbox" id="lineCheckbox">
    </label>
    cagnotte : <input type="tel" id="lineAmount" maxlength="3" placeholder="0"> €
  </div>

  <!-- OPTION -->
  <label>
    Option
    <select id="operation"></select>
  </label>

  <!-- ID PARRAIN -->
  <label>
    ID Parrain
    <input type="text" name="idParrain" id="idParrain">
  </label>

  <!-- CHAMPS CACHÉS -->
  <input type="hidden" name="environment" id="environment">
  <input type="hidden" name="codeOption" id="codeOption">
  <input type="hidden" name="pointsConsommes" id="pointsConsommes">
  <input type="hidden" name="universe" value="RED">
</form>

<a id="finalLink" target="_blank"></a>

<script>
const OPTIONS = {
  MOBILE: {
    DON_5:  { label: "Don 5€", code: "RPD1", points: 5 },
    DON_10: { label: "Don 10€", code: "RPD2", points: 10 },
    REMISE: { label: "Remise 10€", code: "SGG1", points: 10 }
  },
  FIXE: {
    DON_5:  { label: "Don 5€", code: "DONS_PARRAINAGE_RED_5E", points: 5 },
    DON_10: { label: "Don 10€", code: "DONS_PARRAINAGE_RED_10E", points: 10 },
    REMISE: { label: "Remise 15€", code: "GCO_15E_RED", points: 15 }
  }
};

const form = document.getElementById("proxyForm");
const lineSelect = document.getElementById("line");
const operationSelect = document.getElementById("operation");
const idParrainInput = document.getElementById("idParrain");
const envInput = document.getElementById("environment");
const codeInput = document.getElementById("codeOption");
const pointsInput = document.getElementById("pointsConsommes");
const link = document.getElementById("finalLink");
const lineCheckbox = document.getElementById("lineCheckbox");
const lineAmount = document.getElementById("lineAmount");
const lineSettings = document.getElementById("lineSettings");

let currentEnv = null;

// Charger les données de cagnotte depuis localStorage
function loadCagnotteData(lineValue) {
  if (!lineValue) {
    lineCheckbox.checked = false;
    lineAmount.value = '';
    return;
  }
  const data = localStorage.getItem(`cagnotte_${lineValue}`);
  if (data) {
    try {
      const parsed = JSON.parse(data);
      lineCheckbox.checked = parsed.checked || false;
      lineAmount.value = parsed.amount || '';
    } catch (e) {
      console.error('Erreur de chargement des données de cagnotte', e);
      lineCheckbox.checked = false;
      lineAmount.value = '';
    }
  } else {
    lineCheckbox.checked = false;
    lineAmount.value = '';
  }
}

// Sauvegarder les données de cagnotte dans localStorage
function saveCagnotteData(lineValue) {
  if (!lineValue) return;
  const data = {
    checked: lineCheckbox.checked,
    amount: lineAmount.value
  };
  localStorage.setItem(`cagnotte_${lineValue}`, JSON.stringify(data));
}

lineSelect.addEventListener("change", () => {
  const opt = lineSelect.selectedOptions[0];
  if (!opt) {
    lineSettings.style.display = 'none';
    return;
  }

  currentEnv = opt.dataset.env;
  envInput.value = currentEnv;
  idParrainInput.value = opt.dataset.parrain;

  // Afficher les paramètres de cagnotte
  lineSettings.style.display = 'block';
  loadCagnotteData(opt.value);

  operationSelect.innerHTML = "";
  for (const key in OPTIONS[currentEnv]) {
    const o = OPTIONS[currentEnv][key];
    const option = document.createElement("option");
    option.value = key;
    option.innerText = o.label;
    operationSelect.appendChild(option);
  }

  updateOperation();
  updateLink();
});

// Écouteurs pour la checkbox et l'input amount
lineCheckbox.addEventListener('change', () => {
  const opt = lineSelect.selectedOptions[0];
  if (opt) {
    saveCagnotteData(opt.value);
  }
});

lineAmount.addEventListener('input', () => {
  const opt = lineSelect.selectedOptions[0];
  if (opt) {
    saveCagnotteData(opt.value);
  }
});

operationSelect.addEventListener("change", () => {
  updateOperation();
  updateLink();
});

idParrainInput.addEventListener("input", updateLink);

function updateOperation() {
  const key = operationSelect.value;
  if (!key) return;
  const o = OPTIONS[currentEnv][key];
  codeInput.value = o.code;
  pointsInput.value = o.points;
}

function updateLink() {
  const params = new URLSearchParams(new FormData(form));
  const url = form.action + "?" + params.toString();
  link.href = url;
  link.innerText = url;
}

// Charger les données de cagnotte pour la ligne sélectionnée au chargement
window.addEventListener('DOMContentLoaded', () => {
  if (lineSelect.value) {
    lineSettings.style.display = 'block';
    loadCagnotteData(lineSelect.value);
  }
});
</script>

</body>
</html>
