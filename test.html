<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 1rem;
    background: #f5f5f5;
  }
  h1 { text-align: center; font-size: 1.5rem; }
  form { display: flex; flex-direction: column; gap: 0.8rem; background: #fff; padding: 1rem; border-radius: 1rem; }
  .question { display: none; flex-direction: column; gap: 0.5rem; }
  input, select, button { padding: 0.5rem; font-size: 1rem; border-radius: 0.5rem; border: 1px solid #ccc; }
  button { background: #4CAF50; color: #fff; border: none; cursor: pointer; }
  button:hover { background: #45a049; }
  #historyBtn { position: fixed; top: 1rem; right: 1rem; font-size: 1.5rem; cursor: pointer; background: none; border: none; }
  #historyModal, #viewModal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
  .modal-content { background: #fff; padding: 1rem; border-radius: 1rem; width: 90%; max-height: 90%; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; }
  .action-btn { cursor: pointer; font-size: 1.2rem; }
  .delete { color: red; }
  .close { cursor: pointer; float: right; font-size: 1.2rem; margin-left: 1rem; }
</style>
</head>
<body>

<h1>Discover</h1>
<button id="historyBtn">📜</button>

<form id="miniForm">

  <!-- ZONE À MODIFIER POUR AJOUTER DES QUESTIONS SUPPLÉMENTAIRES -->
  <div class="question" data-index="0">
    <input type="text" name="name" placeholder="Nom du client" required>
    <button type="button" class="nextBtn">Suivant</button>
  </div>
  <div class="question" data-index="1">
    <input type="tel" name="phone" placeholder="Téléphone">
    <button type="button" class="nextBtn">Suivant</button>
  </div>
  <div class="question" data-index="2">
    <input type="number" name="age" placeholder="Âge">
    <button type="button" class="nextBtn">Suivant</button>
  </div>
  <div class="question" data-index="3">
    <select name="service">
      <option value="">Sélectionnez un service</option>
      <option value="A">Service A</option>
      <option value="B">Service B</option>
    </select>
    <button type="button" class="nextBtn">Suivant</button>
  </div>
  <div class="question" data-index="4">
    <input type="text" name="notes" placeholder="Notes">
    <button type="button" class="nextBtn">Suivant</button>
  </div>
  <!-- FIN DE LA ZONE À MODIFIER -->

  <div class="question" data-index="5">
    <button type='button' id='sendBtn'>Envoyer un devis</button>
    <button type='button' id='finishBtn'>Terminer</button>
  </div>

</form>

<!-- Historique -->
<div id="historyModal">
  <div class="modal-content">
    <span class="close" id="closeHistory">❌</span>
    <h2>Historique</h2>
    <table id="historyTable">
      <thead>
        <tr><th>Date</th><th>Nom</th><th>Actions</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- Voir réponse -->
<div id="viewModal">
  <div class="modal-content">
    <span class="close" id="closeView">❌</span>
    <h2>Réponses</h2>
    <table id="viewTable">
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
const form = document.getElementById('miniForm');
const questions = document.querySelectorAll('.question');
let currentIndex = 0;

function showQuestion(index) {
  questions.forEach((q, i) => q.style.display = i === index ? 'flex' : 'none');
}
showQuestion(currentIndex);

// Gestion des boutons "Suivant"
document.querySelectorAll('.nextBtn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentIndex++;
    showQuestion(currentIndex);
  });
});

// Boutons finaux
document.getElementById('sendBtn').addEventListener('click', () => submitForm(true));
document.getElementById('finishBtn').addEventListener('click', () => submitForm(false));

function submitForm(redirect) {
  const data = {};
  new FormData(form).forEach((value, key) => data[key] = value);
  data.date = new Date().toISOString();
  let history = JSON.parse(localStorage.getItem('miniFormHistory') || '[]');
  history.push(data);
  localStorage.setItem('miniFormHistory', JSON.stringify(history));
  if(redirect) window.location.href = 'https://hub03.github.io/devis.html';
  else {
    alert('Réponses sauvegardées !');
    form.reset();
    currentIndex = 0;
    showQuestion(currentIndex);
  }
}

// Historique
const historyBtn = document.getElementById('historyBtn');
const historyModal = document.getElementById('historyModal');
const closeHistory = document.getElementById('closeHistory');
const historyTableBody = document.querySelector('#historyTable tbody');
const viewModal = document.getElementById('viewModal');
const closeView = document.getElementById('closeView');
const viewTableBody = document.querySelector('#viewTable tbody');

historyBtn.addEventListener('click', () => {
  renderHistory();
  historyModal.style.display = 'flex';
});
closeHistory.addEventListener('click', () => historyModal.style.display = 'none');
closeView.addEventListener('click', () => viewModal.style.display = 'none');

function renderHistory() {
  const history = JSON.parse(localStorage.getItem('miniFormHistory') || '[]');
  historyTableBody.innerHTML = '';
  history.forEach((entry, index) => {
    const tr = document.createElement('tr');
    const date = new Date(entry.date).toLocaleString();
    tr.innerHTML = `<td>${date}</td>
                    <td>${entry.name || ''}</td>
                    <td>
                      <span class="action-btn" onclick="viewEntry(${index})">👁️</span>
                      <span class="action-btn delete" onclick="deleteEntry(${index})">❌</span>
                    </td>`;
    historyTableBody.appendChild(tr);
  });
}

function viewEntry(index) {
  const history = JSON.parse(localStorage.getItem('miniFormHistory') || '[]');
  const entry = history[index];
  viewTableBody.innerHTML = '';
  for (let key in entry) {
    if (key !== 'date') {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${key}</td><td>${entry[key]}</td>`;
      viewTableBody.appendChild(tr);
    }
  }
  viewModal.style.display = 'flex';
}

function deleteEntry(index) {
  if (!confirm('Supprimer cet enregistrement ?')) return;
  let history = JSON.parse(localStorage.getItem('miniFormHistory') || '[]');
  history.splice(index, 1);
  localStorage.setItem('miniFormHistory', JSON.stringify(history));
  renderHistory();
}
</script>

</body>
</html>
