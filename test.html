<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Questionnaire</title>

<style>

body{
font-family:Arial;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

#app{
width:420px;
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 10px 25px rgba(0,0,0,0.1);
}

h2{
margin-top:0;
}

input,select{
width:100%;
padding:10px;
margin-top:10px;
}

button{
margin-top:20px;
padding:10px 20px;
cursor:pointer;
}

#admin{
display:none;
}

.questionRow{
border:1px solid #ddd;
padding:10px;
margin:10px 0;
}

.small{
font-size:12px;
color:#777;
}

</style>
</head>

<body>

<div id="app"></div>

<script>

// ⚠️ METTRE TON URL APPS SCRIPT ICI
const API = "PASTE_YOUR_SCRIPT_URL_HERE"

const ADMIN_PASSWORD = "admin123"

let questions=[]
let answers={}
let index=0

async function loadQuestions(){

const r = await fetch(API)
questions = await r.json()

questions.sort((a,b)=>Number(a.order)-Number(b.order))

startQuiz()

}

function startQuiz(){

index=0
answers={}
renderQuestion()

}

function renderQuestion(){

if(index>=questions.length){

finishQuiz()
return
}

const q=questions[index]

let input=""

if(q.type==="text"){
input=`<input id="answer">`
}

if(q.type==="number"){
input=`<input type="number" id="answer">`
}

if(q.type==="select"){

let opts=q.options.split(",")

input=`<select id="answer">
${opts.map(o=>`<option>${o}</option>`).join("")}
</select>`

}

app.innerHTML=`

<h2>${q.label}</h2>

${input}

<button onclick="next()">Suivant</button>

<div class="small">
${index+1} / ${questions.length}
</div>

`

}

function next(){

let val=document.getElementById("answer").value

answers[questions[index].id]=val

index++

renderQuestion()

}

async function finishQuiz(){

let client=answers["q1"]||""

await fetch(API,{
method:"POST",
body:JSON.stringify({
client:client,
answers:answers
})
})

app.innerHTML=`

<h2>Merci 👍</h2>

<button onclick="startQuiz()">Nouveau questionnaire</button>

<button onclick="adminLogin()">Admin</button>

`

}

// ADMIN

function adminLogin(){

let p=prompt("Mot de passe admin")

if(p===ADMIN_PASSWORD){

renderAdmin()

}else{

alert("Accès refusé")

}

}

function renderAdmin(){

app.innerHTML=`

<h2>Administration</h2>

<div id="questionList"></div>

<hr>

<h3>Ajouter question</h3>

<input id="newLabel" placeholder="Question">

<select id="newType">
<option value="text">Text</option>
<option value="number">Number</option>
<option value="select">Select</option>
</select>

<input id="newOptions" placeholder="Options (a,b,c)">

<button onclick="addQuestion()">Ajouter</button>

<button onclick="saveQuestions()">💾 Sauvegarder</button>

<button onclick="loadQuestions()">Retour</button>

`

renderQuestionList()

}

function renderQuestionList(){

let html=""

questions.forEach((q,i)=>{

html+=`

<div class="questionRow">

<input value="${q.label}" onchange="questions[${i}].label=this.value">

<br>

<select onchange="questions[${i}].type=this.value">

<option ${q.type=="text"?"selected":""}>text</option>
<option ${q.type=="number"?"selected":""}>number</option>
<option ${q.type=="select"?"selected":""}>select</option>

</select>

<br>

<input value="${q.options||""}" onchange="questions[${i}].options=this.value">

<br>

<button onclick="moveUp(${i})">↑</button>
<button onclick="moveDown(${i})">↓</button>
<button onclick="removeQ(${i})">Supprimer</button>

</div>

`

})

document.getElementById("questionList").innerHTML=html

}

function addQuestion(){

let label=document.getElementById("newLabel").value
let type=document.getElementById("newType").value
let options=document.getElementById("newOptions").value

questions.push({
id:"q"+Date.now(),
label:label,
type:type,
options:options,
order:questions.length+1
})

renderQuestionList()

}

function removeQ(i){

questions.splice(i,1)

renderQuestionList()

}

function moveUp(i){

if(i===0)return

let t=questions[i]
questions[i]=questions[i-1]
questions[i-1]=t

renderQuestionList()

}

function moveDown(i){

if(i===questions.length-1)return

let t=questions[i]
questions[i]=questions[i+1]
questions[i+1]=t

renderQuestionList()

}

async function saveQuestions(){

for(let i=0;i<questions.length;i++){

questions[i].order=i+1

}

await fetch(API+"?updateQuestions=true",{
method:"POST",
body:JSON.stringify(questions)
})

alert("Questions sauvegardées")

loadQuestions()

}

// START

loadQuestions()

</script>

</body>
</html>
