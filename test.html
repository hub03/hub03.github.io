<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Questionnaire</title>

<style>

body{
font-family:system-ui;
background:#f2f2f2;
margin:0;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

#app{
width:100%;
max-width:420px;
background:white;
padding:30px;
box-sizing:border-box;
min-height:100vh;
}

h2{
font-size:22px;
margin-bottom:20px;
}

input,select{
width:100%;
padding:14px;
font-size:16px;
margin-top:10px;
box-sizing:border-box;
}

button{
width:100%;
padding:16px;
font-size:16px;
margin-top:20px;
background:black;
color:white;
border:none;
border-radius:6px;
}

button.secondary{
background:#ddd;
color:black;
}

.progress{
height:6px;
background:#eee;
margin-bottom:20px;
border-radius:3px;
overflow:hidden;
}

.progressBar{
height:100%;
background:black;
width:0%;
}

.questionRow{
border:1px solid #ddd;
padding:10px;
margin:10px 0;
border-radius:6px;
}

.small{
font-size:13px;
color:#666;
margin-top:10px;
}

</style>
</head>

<body>

<div id="app"></div>

<script>

const API="https://script.google.com/macros/s/AKfycbxWJxwkBqnMK5skhD3o2MD1xfMluucJGpsydotQb0j37njauTC3lsooYlwq7umQXLPXXA/exec"
const ADMIN_PASSWORD="admin123"

let questions=[]
let answers={}
let index=0

const app=document.getElementById("app")

async function loadQuestions(){

app.innerHTML="Chargement..."

const r=await fetch(API)

questions=await r.json()

questions.sort((a,b)=>Number(a.order)-Number(b.order))

startQuiz()

}

function startQuiz(){

index=0
answers={}
renderQuestion()

}

function renderQuestion(){

if(index>=questions.length){

finishQuiz()
return
}

const q=questions[index]

let input=""

if(q.type==="text"){
input=`<input id="answer" autocomplete="off">`
}

if(q.type==="number"){
input=`<input type="number" id="answer">`
}

if(q.type==="select"){

let opts=(q.options||"").split(",")

input=`<select id="answer">
${opts.map(o=>`<option value="${o.trim()}">${o.trim()}</option>`).join("")}
</select>`

}

let progress=((index)/questions.length)*100

app.innerHTML=`

<div class="progress">
<div class="progressBar" style="width:${progress}%"></div>
</div>

<h2>${q.label}</h2>

${input}

<button onclick="next()">Suivant</button>

<div class="small">${index+1} / ${questions.length}</div>

`

}

function next(){

let el=document.getElementById("answer")

if(!el) return

let val=el.value.trim()

if(val===""){
alert("Veuillez répondre")
return
}

answers[questions[index].id]=val

index++

renderQuestion()

}

async function finishQuiz(){

app.innerHTML="<h2>Envoi...</h2>"

let client=answers["q1"]||""

try{
  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      client:client,
      answers:answers
    })
  })
  
  if(!res.ok) throw new Error("Erreur réseau")

  // Succès
  app.innerHTML=`
  <h2>Merci 👍</h2>
  <button onclick="startQuiz()">Nouveau questionnaire</button>
  <button class="secondary" onclick="adminLogin()">Administration</button>
  `
  
}catch(e){
  console.error(e)
  app.innerHTML=`
  <h2>Erreur lors de l'envoi 😢</h2>
  <p>Vérifie ta connexion ou l'URL de l'API</p>
  <button onclick="startQuiz()">Réessayer</button>
  `
}

}

function adminLogin(){

let p=prompt("Mot de passe admin")

if(p!==ADMIN_PASSWORD){
alert("Accès refusé")
return
}

renderAdmin()

}

function renderAdmin(){

app.innerHTML=`

<h2>Administration</h2>

<div id="questionList"></div>

<hr>

<h3>Ajouter question</h3>

<input id="newLabel" placeholder="Question">

<select id="newType">
<option value="text">Texte</option>
<option value="number">Nombre</option>
<option value="select">Liste</option>
</select>

<input id="newOptions" placeholder="Options (a,b,c)">

<button onclick="addQuestion()">Ajouter</button>

<button onclick="saveQuestions()">Sauvegarder</button>

<button class="secondary" onclick="loadQuestions()">Retour</button>

<hr>

<button onclick="exportCSV()">Exporter réponses CSV</button>

`

renderQuestionList()

}

function renderQuestionList(){

let html=""

questions.forEach((q,i)=>{

html+=`

<div class="questionRow">

<input value="${q.label}" onchange="questions[${i}].label=this.value">

<select onchange="questions[${i}].type=this.value">

<option ${q.type=="text"?"selected":""}>text</option>
<option ${q.type=="number"?"selected":""}>number</option>
<option ${q.type=="select"?"selected":""}>select</option>

</select>

<input value="${q.options||""}" placeholder="options" onchange="questions[${i}].options=this.value">

<br>

<button onclick="moveUp(${i})">↑</button>
<button onclick="moveDown(${i})">↓</button>
<button onclick="removeQ(${i})">Supprimer</button>

</div>

`

})

document.getElementById("questionList").innerHTML=html

}

function addQuestion(){

let label=document.getElementById("newLabel").value
let type=document.getElementById("newType").value
let options=document.getElementById("newOptions").value

questions.push({
id:"q"+Date.now(),
label:label,
type:type,
options:options,
order:questions.length+1
})

renderQuestionList()

}

function removeQ(i){

questions.splice(i,1)

renderQuestionList()

}

function moveUp(i){

if(i===0)return

let t=questions[i]
questions[i]=questions[i-1]
questions[i-1]=t

renderQuestionList()

}

function moveDown(i){

if(i===questions.length-1)return

let t=questions[i]
questions[i]=questions[i+1]
questions[i+1]=t

renderQuestionList()

}

async function saveQuestions(){

questions.forEach((q,i)=>q.order=i+1)

await fetch(API+"?updateQuestions=true",{
method:"POST",
body:JSON.stringify(questions)
})

alert("Questions sauvegardées")

loadQuestions()

}

function exportCSV(){

window.open("https://docs.google.com/spreadsheets")

}

loadQuestions()

</script>

</body>
</html>
