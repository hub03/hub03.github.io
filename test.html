<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 1rem;
    background: #f5f5f5;
  }
  h1 { text-align: center; font-size: 1.5rem; }
  form { display: flex; flex-direction: column; gap: 0.8rem; background: #fff; padding: 1rem; border-radius: 1rem; position: relative; }
  .question { display: none; flex-direction: column; gap: 0.5rem; }
  input, select, button { padding: 0.5rem; font-size: 1rem; border-radius: 0.5rem; border: 1px solid #ccc; }
  button { cursor: pointer; }
  #historyBtn { position: fixed; top: 1rem; right: 1rem; font-size: 1.5rem; background: none; border: none; }

  /* Navigation unique */
  #navigation { display: flex; justify-content: space-between; margin-top: 1rem; }
  #prevBtn { background-color: #bbb; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 0.5rem; }
  #prevBtn:hover { background-color: #999; }
  #nextBtn { background-color: #4CAF50; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 0.5rem; }
  #nextBtn:hover { background-color: #45a049; }

  /* Boutons checkbox stylisés */
  .btn-checkbox { display: inline-block; padding: 0.6rem 1.2rem; margin-right: 0.5rem; border: 1px solid #ccc; border-radius: 0.6rem; cursor: pointer; background-color: #f0f0f0; user-select: none; transition: all 0.2s ease; }
  input[type="checkbox"]:checked + .btn-checkbox { background-color: #4CAF50; color: white; border-color: #4CAF50; }

  #historyModal, #viewModal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
  .modal-content { background: #fff; padding: 1rem; border-radius: 1rem; width: 90%; max-height: 90%; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { border: 1px solid #ddd; padding: 0.5rem; text-align: left; }
  .action-btn { cursor: pointer; font-size: 1.2rem; }
  .delete { color: red; }
  .close { cursor: pointer; float: right; font-size: 1.2rem; margin-left: 1rem; }
</style>
</head>
<body>

<h1>Discover</h1>
<button id="historyBtn">📜</button>

<form id="miniForm">

<!-- QUESTIONS -->
<div class="question" data-index="0">
  🙋 Quel est votre nom ?
  <br><input type="text" name="client" placeholder="Nom du client" required>
</div>
<div class="question" data-index="1">
  📱 Quel est votre numéro de téléphone ?
  <br><input type="tel" name="numero" placeholder="Téléphone">
</div>
<div class="question" data-index="2">
  🧑‍🔧 L'une de vos lignes est-elle utilisée à titre professionnel ?
  <br><input type="checkbox" id="pro" name="pro" hidden>
  <label for="pro" class="btn-checkbox">Oui ✅</label>
  <br>🧑‍💻 Faites-vous du télétravail ?<input type="checkbox" id="teletravail" name="teletravail" hidden>
  <label for="teletravail" class="btn-checkbox">Oui ✅</label>
</div>
<!-- <div class="question" data-index="X">
  🤝
  <br><select name="motif_visite">
    <option value="" selected disabled hidden>Motif de visite</option>
    <option value="Fixe">Fixe</option>
    <option value="Mobile">Mobile</option>
    <option value="Parc">Parc</option>
  </select>
</div> -->
<div class="question" data-index="3">
  🧑‍🤝‍🧑 Combien de personnes vivent dans votre foyer ?
  <br><input type="tel" name="adultes" placeholder="Adultes">
  <br><input type="tel" name="enfants" placeholder="Enfants">
</div>
<div class="question" data-index="5">
  <button type='button' id='sendBtn'>Envoyer un devis</button>
  <button type='button' id='finishBtn'>Terminer</button>
</div>

<!-- Navigation unique -->
<div id="navigation">
  <button type="button" id="prevBtn">&lt;-</button>
  <button type="button" id="nextBtn">Suivant</button>
</div>

</form>

<!-- Historique -->
<div id="historyModal">
  <div class="modal-content">
    <span class="close" id="closeHistory">❌</span>
    <h2>Historique</h2>
    <table id="historyTable">
      <thead>
        <tr><th>Date</th><th>Nom</th><th>Actions</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- Voir réponse -->
<div id="viewModal">
  <div class="modal-content">
    <span class="close" id="closeView">❌</span>
    <h2>Réponses</h2>
    <table id="viewTable">
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
const form = document.getElementById('miniForm');
const questions = document.querySelectorAll('.question');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
let currentIndex = 0;

function showQuestion(index) {
  questions.forEach((q, i) => q.style.display = i === index ? 'flex' : 'none');

  // Focus automatique sur input texte/tel/number
  const currentQuestion = questions[index];
  const inputToFocus = currentQuestion.querySelector('input[type="text"], input[type="tel"], input[type="number"]');
  if (inputToFocus) inputToFocus.focus();

  // Masquer/afficher boutons navigation selon l'index
  prevBtn.style.display = index === 0 ? 'none' : 'inline-block';
  nextBtn.style.display = index >= questions.length - 1 ? 'none' : 'inline-block';
}

showQuestion(currentIndex);

prevBtn.addEventListener('click', () => {
  if (currentIndex > 0) {
    currentIndex--;
    showQuestion(currentIndex);
  }
});

nextBtn.addEventListener('click', () => {
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    showQuestion(currentIndex);
  }
});

// Boutons finaux
document.getElementById('sendBtn').addEventListener('click', () => submitForm(true));
document.getElementById('finishBtn').addEventListener('click', () => submitForm(false));

function submitForm(redirect) {
  const data = {};
  new FormData(form).forEach((value, key) => data[key] = value);
  form.querySelectorAll('input[type=checkbox]').forEach(cb => {
    data[cb.name] = cb.checked ? 'Oui' : 'Non';
  });
  data.date = new Date().toISOString();
  let history = JSON.parse(localStorage.getItem('miniFormHistory') || '[]');
  history.push(data);
  localStorage.setItem('miniFormHistory', JSON.stringify(history));
  if (redirect) window.location.href = 'https://hub03.github.io/devis.html';
  else {
    alert('Réponses sauvegardées !');
    form.reset();
    currentIndex = 0;
    showQuestion(currentIndex);
  }
}

// Historique
const historyBtn = document.getElementById('historyBtn');
const historyModal = document.getElementById('historyModal');
const closeHistory = document.getElementById('closeHistory');
const historyTableBody = document.querySelector('#historyTable tbody');
const viewModal = document.getElementById('viewModal');
const closeView = document.getElementById('closeView');
const viewTableBody = document.querySelector('#viewTable tbody');

historyBtn.addEventListener('click', () => { renderHistory(); historyModal.style.display = 'flex'; });
closeHistory.addEventListener('click', () => historyModal.style.display = 'none');
closeView.addEventListener('click', () => viewModal.style.display = 'none');

function renderHistory() {
  const history = JSON.parse(localStorage.getItem('miniFormHistory') || '[]');
  historyTableBody.innerHTML = '';
  history.forEach((entry, index) => {
    const tr = document.createElement('tr');
    const date = new Date(entry.date).toLocaleString();
    tr.innerHTML = `<td>${date}</td><td>${entry.client || ''}</td>
                    <td>
                      <span class="action-btn" onclick="viewEntry(${index})">👁️</span>
                      <span class="action-btn delete" onclick="deleteEntry(${index})">❌</span>
                    </td>`;
    historyTableBody.appendChild(tr);
  });
}

function viewEntry(index) {
  const history = JSON.parse(localStorage.getItem('miniFormHistory') || '[]');
  const entry = history[index];
  viewTableBody.innerHTML = '';
  for (let key in entry) {
    if (key !== 'date') {
      let value = entry[key];
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${key}</td><td>${value}</td>`;
      viewTableBody.appendChild(tr);
    }
  }
  viewModal.style.display = 'flex';
}

function deleteEntry(index) {
  if (!confirm('Supprimer cet enregistrement ?')) return;
  let history = JSON.parse(localStorage.getItem('miniFormHistory') || '[]');
  history.splice(index, 1);
  localStorage.setItem('miniFormHistory', JSON.stringify(history));
  renderHistory();
}
</script>

</body>
</html>
